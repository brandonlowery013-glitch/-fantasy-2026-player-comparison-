<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fantasy 2026 Player Comparison</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#08111f}</style></head><body><iframe id="app" src="index-backup.html" title="Fantasy 2026 Player Comparison"></iframe><script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=frame.contentDocument;
  if(!w||!d)return;
  const rowVal=(r,keys)=>{for(const k of keys){if(r&&r[k]!=null&&String(r[k]).trim()!=='')return r[k]}return '—'};
  function profilePanel(p){
    const h=typeof w.histRows==='function'?w.histRows(p):[];
    const r=h.length?h[h.length-1]:null;
    if(!r)return w.readBlock('Scoring Profile','No NFL regular-season scoring history in the stored table.');
    let items=[];
    if(p.p==='QB')items=[['Pass yds',rowVal(r,['Pass Yards','PassYds','Passing Yards'])],['Pass TDs',rowVal(r,['Pass TD','PassTD','Passing TD'])],['Rush yds',rowVal(r,['Rush Yards','RushYds','Rush Yds'])],['Rush TDs',rowVal(r,['Rush TD','RushTD'])],['INT',rowVal(r,['INT','Interceptions'])]];
    else if(p.p==='RB')items=[['Carries',rowVal(r,['Carries','Rush Att','Rush Att.','Car'])],['Rush yds',rowVal(r,['Rush Yards','Rush Yds','RushYds'])],['Rush TDs',rowVal(r,['Rush TD','RushTD'])],['Receptions',rowVal(r,['Receptions','Rec','Rec.'])],['Rec yds',rowVal(r,['Receiving Yards','Rec Yards','Rec. Yards','RecYds'])],['Rec TDs',rowVal(r,['Receiving TD','Rec TD','Rec. TD','RecTD'])]];
    else items=[['Receptions',rowVal(r,['Receptions','Rec','Rec.'])],['Rec yds',rowVal(r,['Receiving Yards','Rec Yards','Rec. Yards','RecYds'])],['Rec TDs',rowVal(r,['TD','Receiving TD','Rec TD','Rec. TD','RecTD'])],['Yds / rec',rowVal(r,['Yards/Reception','YPR','Yards per Reception'])]];
    return `<div class="metricBlock"><span class="metricLabel">${w.seasonLabel(r)} scoring profile</span><div class="projectionGroup">${items.map(([k,v])=>`<div class="statLine"><span>${k}:</span><b>${v}</b></div>`).join('')}</div></div>`;
  }
  function scoringSection(ps){return `<div class="detail scoring-profile-live"><div class="detailHead"><h3>Position Scoring Profile</h3><span class="edge">Context only</span></div><div class="categoryPurpose">How each player generated fantasy production in his most recent NFL season using the scoring components that matter for his position.</div><div class="compareRows ${ps.length===3?'three':''}">${ps.map(p=>`<div class="compareCell"><div class="playerName">${p.n}</div>${profilePanel(p)}</div>`).join('')}</div></div>`}
  w.ceilingPathText=function(p){const x=[];if(p.p==='QB'){x.push('passing volume and touchdown efficiency finish near the top of the upside projection');x.push('rushing production remains a meaningful weekly scoring source')}else if(p.p==='RB'){x.push('lead-back touch share holds or expands');x.push('receiving work stays involved enough to raise the PPR floor');x.push('goal-line and red-zone chances convert near the high end of the projection')}else if(p.p==='WR'){x.push('route participation and target share stay at or above expectation');x.push('reception and yardage volume reach the upper end of the projection');x.push('red-zone targets convert into enough touchdowns to separate from the WR field')}else{x.push('route participation and target share stay at or above expectation');x.push('reception volume reaches the upper end of the projection');x.push('red-zone usage converts into enough touchdowns to create a positional edge')}if(p.e>=8.7)x.push('the offensive environment sustains scoring opportunities');if(p.su>=8.7)x.push('efficiency remains sustainable rather than regressing');return x.join('; ')+'.'};
  w.bustPathText=function(p){const x=[];if(p.st&&p.st!=='PASS')x.push(`health/status issue (${p.st}) costs games, snaps or workload`);if(p.p==='QB'){x.push('passing efficiency or touchdown rate falls below the median projection');x.push('rushing production fails to provide the expected weekly cushion')}else if(p.p==='RB'){x.push('committee usage cuts carries or goal-line work');x.push('receiving involvement comes in below expectation');x.push('touchdown regression makes the workload less valuable')}else if(p.p==='WR'){x.push('route participation or target share falls below expectation');x.push('yardage efficiency drops without enough volume to compensate');x.push('touchdown production fails to offset weaker weekly volume')}else{x.push('route participation or target share falls below expectation');x.push('reception volume does not reach a difference-making level');x.push('touchdown production is too low to separate at tight end')}if(p.e<8)x.push('the offensive environment limits scoring opportunities');if(p.rl<8)x.push('week-to-week volatility makes the season projection harder to realize');return x.join('; ')+'.'};
  const cats=d.getElementById('cats');
  if(cats&&!cats.querySelector('input[value="score"]')){
    const label=d.createElement('label');label.className='cat';label.innerHTML='<input class="cb" type="checkbox" value="score" checked> Position Scoring Profile';
    const env=[...cats.querySelectorAll('label')].find(x=>x.textContent.includes('Offensive Environment'));
    cats.insertBefore(label,env||null);
  }
  if(typeof w.run==='function'&&!w.__scoringRunWrapped){
    const baseRun=w.run;
    w.run=function(){baseRun();try{const cb=d.querySelector('input.cb[value="score"]');if(cb&&cb.checked){const ps=w.selected();const html=scoringSection(ps);const details=d.getElementById('details');const hist=[...details.querySelectorAll('.detail')].find(el=>el.querySelector('h3')?.textContent.trim()==='Past 3 Seasons');if(hist)hist.insertAdjacentHTML('afterend',html);else details.insertAdjacentHTML('beforeend',html)}}catch(e){console.warn('Scoring profile render failed',e)}};
    w.__scoringRunWrapped=true;
  }
});
</script></body></html>
