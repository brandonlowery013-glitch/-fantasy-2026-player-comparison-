<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fantasy 2026 Player Comparison</title><style>html,body{margin:0;min-height:100%;background:#08111f;color:#f3f7fc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{padding:24px}</style></head><body><div id="boot">Loading Fantasy 2026 comparison engine…</div><script>(async()=>{const RAW='https://raw.githubusercontent.com/brandonlowery013-glitch/-fantasy-2026-player-comparison-/main/';const STAMP='20260824-2054';try{const shards=await Promise.all(Array.from({length:13},(_,i)=>fetch(RAW+`players${i}.json?v=${STAMP}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`players${i}.json unavailable`);return r.json()})));const active=shards.flat(),names=active.map(p=>p.n),unique=new Set(names);if(active.length!==162||unique.size!==162)throw Error(`162-player QA failed (${active.length} active / ${unique.size} unique)`);const current=await fetch(RAW+'current162patch-2026-08-24.json?v='+STAMP,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Current 162-player update unavailable');return r.json()});const missing=Object.keys(current.players||{}).filter(n=>!unique.has(n));if(missing.length)throw Error('Current update player mismatch: '+missing.join(', '));const envSpecific=await fetch(RAW+'environmentSpecifics2026.json?v='+STAMP,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Player-specific environment layer unavailable');return r.json()});const envMissing=Object.keys(envSpecific.players||{}).filter(n=>!unique.has(n));if(envMissing.length)throw Error('Environment-specific player mismatch: '+envMissing.join(', '));let h=await fetch(RAW+'index-backup.html?v='+STAMP,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Comparison app unavailable');return r.text()});h=h.replace("let files=Array.from({length:13},(_,i)=>`players${i}.json`)","let files=Array.from({length:13},(_,i)=>`"+RAW+"players${i}.json`)");for(const f of ['market2026.json','injuryOverrides2026.json','lockedRanks2026.json','historicalStats2026.json'])h=h.split("'"+f+"'").join("'"+RAW+f+"'");h=h.replace("return s[p.n]||p.en||'No more specific team-context note is stored yet.'","return p.enx||s[p.n]||p.en||'No more specific team-context note is stored yet.'");const needle=";fill()}catch(e){document.querySelector('.wrap')";const patch=";try{let ur=await fetch('"+RAW+"current162patch-2026-08-24.json?v="+STAMP+"',{cache:'no-store'});if(ur.ok){let uj=await ur.json();let up=uj.players||{};P.forEach(p=>{let x=up[p.n];if(x)Object.assign(p,x)});P.forEach(p=>{p.s=Number((p.pd*.35+p.ce*.20+p.r*.15+p.e*.10+p.a*.10+p.rl*.05+p.su*.05).toFixed(3))})}}catch(e){console.warn('Current 162-player update unavailable',e)};try{let er=await fetch('"+RAW+"environmentSpecifics2026.json?v="+STAMP+"',{cache:'no-store'});if(er.ok){let ej=await er.json();let ep=ej.players||{};P.forEach(p=>{let x=ep[p.n];if(x&&x.environment_detail)p.enx=x.environment_detail})}}catch(e){console.warn('Player-specific environment layer unavailable',e)};fill()}catch(e){document.querySelector('.wrap')";if(!h.includes(needle))throw Error('Runtime patch point unavailable');h=h.replace(needle,patch);document.open();document.write(h);document.close()}catch(e){document.getElementById('boot').textContent='Player data failed to load. '+e.message;console.error(e)}})();</script></body></html>
