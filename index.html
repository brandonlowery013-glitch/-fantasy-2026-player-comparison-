<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fantasy 2026 Player Comparison</title><style>html,body{margin:0;min-height:100%;background:#08111f;color:#f3f7fc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{padding:24px}</style></head><body><div id="boot">Loading Fantasy 2026 comparison engine…</div><script>(async()=>{const RAW='https://raw.githubusercontent.com/brandonlowery013-glitch/-fantasy-2026-player-comparison-/main/';const STAMP='20260824-2124';try{const shards=await Promise.all(Array.from({length:13},(_,i)=>fetch(RAW+`players${i}.json?v=${STAMP}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`players${i}.json unavailable`);return r.json()})));const active=shards.flat(),names=active.map(p=>p.n),unique=new Set(names);if(active.length!==162||unique.size!==162)throw Error(`162-player QA failed (${active.length} active / ${unique.size} unique)`);const current=await fetch(RAW+'current162patch-2026-08-24.json?v='+STAMP,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Current 162-player update unavailable');return r.json()});const missing=Object.keys(current.players||{}).filter(n=>!unique.has(n));if(missing.length)throw Error('Current update player mismatch: '+missing.join(', '));const envSpecific=await fetch(RAW+'environmentSpecifics2026.json?v='+STAMP,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Player-specific environment layer unavailable');return r.json()});const envMissing=Object.keys(envSpecific.players||{}).filter(n=>!unique.has(n));if(envMissing.length)throw Error('Environment-specific player mismatch: '+envMissing.join(', '));const oddsLayer=await fetch(RAW+'vegasOdds2026.json?v='+STAMP,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Vegas odds layer unavailable');return r.json()});const oddsMissing=Object.keys(oddsLayer.players||{}).filter(n=>!unique.has(n));if(oddsMissing.length)throw Error('Vegas odds player mismatch: '+oddsMissing.join(', '));let h=await fetch(RAW+'index-backup.html?v='+STAMP,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Comparison app unavailable');return r.text()});h=h.replace("let files=Array.from({length:13},(_,i)=>`players${i}.json`)","let files=Array.from({length:13},(_,i)=>`"+RAW+"players${i}.json`)");for(const f of ['market2026.json','injuryOverrides2026.json','lockedRanks2026.json','historicalStats2026.json'])h=h.split("'"+f+"'").join("'"+RAW+f+"'");h=h.replace("return s[p.n]||p.en||'No more specific team-context note is stored yet.'","return p.enx||s[p.n]||p.en||'No more specific team-context note is stored yet.'");const oldVegas="function vegasPanel(p){return projectionBlock('Sportsbook',p.vl||'No line available')+projectionBlock('Our Projection',p.m)+projectionBlock('Consensus Projection',p.cn||'No consensus projection available')+blocks([['Our Projected PPR',fmt(p.mp,1)],['Consensus PPR',fmt(p.cp,1)]])+readBlock('Read',p.vr||'No meaningful gap.')}";const newVegas=`function americanProb(o){o=Number(o);if(!Number.isFinite(o)||o===0)return null;return o<0?(-o)/((-o)+100):100/(o+100)}
function oddsText(o){o=Number(o);return !Number.isFinite(o)?'—':o>0?'+'+o:String(o)}
function pricedMarketBlock(p){let ms=p.vo&&Array.isArray(p.vo.markets)?p.vo.markets:[];if(!ms.length)return readBlock('Current O/U price','Two-sided Over/Under pricing not captured for this player yet.');return ms.map(x=>{let po=americanProb(x.over),pu=americanProb(x.under),sum=(po||0)+(pu||0),fairO=sum?po/sum:null,fairU=sum?pu/sum:null,lean=fairO==null?'—':fairO>=.52?'Over lean':fairO<=.48?'Under lean':'Balanced price',fair=fairO==null?'':(' · De-vig O '+(fairO*100).toFixed(1)+'% / U '+(fairU*100).toFixed(1)+'%');return readBlock('Current priced market',x.label+' '+x.line+' · '+x.book+' · O '+oddsText(x.over)+' / U '+oddsText(x.under))+readBlock('Price signal',lean+fair+' · '+(x.source_date||''));}).join('')}
function midRange(a,b){a=Number(a);b=Number(b);return Number.isFinite(a)&&Number.isFinite(b)?(a+b)/2:null}
function metricMap(text){let z={},s=String(text||''),m;const put=(k,v)=>{v=Number(v);if(Number.isFinite(v))z[k]=v};const rng=(k,re)=>{let q=s.match(re);if(q)z[k]=midRange(q[1],q[2])};rng('rec',/Rec\\s+(\\d+(?:\\.\\d+)?)[-–](\\d+(?:\\.\\d+)?)/i);rng('recyd',/Rec\\s+\\d+(?:\\.\\d+)?[-–]\\d+(?:\\.\\d+)?\\s*\\/\\s*(\\d+(?:\\.\\d+)?)[-–](\\d+(?:\\.\\d+)?)\\s*yd/i);rng('rectd',/Rec[^·]*?\\/\\s*\\d+(?:\\.\\d+)?[-–]\\d+(?:\\.\\d+)?\\s*yd\\s*\\/\\s*(\\d+(?:\\.\\d+)?)[-–](\\d+(?:\\.\\d+)?)\\s*TD/i);rng('rushyd',/Rush\\s+(\\d+(?:\\.\\d+)?)[-–](\\d+(?:\\.\\d+)?)\\s*yd/i);rng('rushtd',/Rush[^·]*?\\/\\s*(\\d+(?:\\.\\d+)?)[-–](\\d+(?:\\.\\d+)?)\\s*TD/i);rng('passyd',/Pass\\s+(\\d+(?:\\.\\d+)?)[-–](\\d+(?:\\.\\d+)?)\\s*yd/i);rng('passtd',/Pass[^·]*?\\/\\s*(\\d+(?:\\.\\d+)?)[-–](\\d+(?:\\.\\d+)?)\\s*TD/i);if((m=s.match(/Rec\\s+(\\d+(?:\\.\\d+)?)\\s*\\/\\s*(\\d+(?:\\.\\d+)?)\\s*yd\\s*\\/\\s*(\\d+(?:\\.\\d+)?)\\s*TD/i))){put('rec',m[1]);put('recyd',m[2]);put('rectd',m[3])}if((m=s.match(/Rush\\s+(\\d+(?:\\.\\d+)?)\\s*yd\\s*\\/\\s*(\\d+(?:\\.\\d+)?)\\s*TD/i))){put('rushyd',m[1]);put('rushtd',m[2])}if((m=s.match(/Pass\\s+(\\d+(?:\\.\\d+)?)\\s*yd\\s*\\/\\s*(\\d+(?:\\.\\d+)?)\\s*TD/i))){put('passyd',m[1]);put('passtd',m[2])}return z}
function smartVegasRead(p){let v=metricMap(p.vl),o=metricMap(p.m),c=metricMap(p.cn),keys=Object.keys(v).filter(k=>o[k]!=null||c[k]!=null);if(!keys.length)return p.vr||'No directly comparable sportsbook stat line.';let bothAbove=0,bothBelow=0,ourOut=0,consOut=0,agree=0;for(let k of keys){let vv=v[k],oo=o[k],cc=c[k],tol=Math.max(Math.abs(vv)*.025,k.includes('td')?.35:1);if(oo!=null&&cc!=null){let od=oo-vv,cd=cc-vv;if(od>tol&&cd>tol)bothAbove++;else if(od<-tol&&cd<-tol)bothBelow++;else if(Math.abs(oo-cc)<=tol)agree++;if(oo-cc>tol)ourOut++;else if(cc-oo>tol)consOut++;}}let a=[];if(bothAbove)a.push('Sportsbook threshold is conservative versus both our model and consensus on '+bothAbove+' comparable market'+(bothAbove>1?'s':''));if(bothBelow)a.push('Sportsbook threshold is above both our model and consensus on '+bothBelow+' comparable market'+(bothBelow>1?'s':''));if(ourOut>consOut)a.push('Our model is additionally more bullish than consensus');else if(consOut>ourOut)a.push('Consensus is more bullish than our model');else if(agree||(!ourOut&&!consOut))a.push('Our model and consensus are broadly aligned');return a.length?a.join('. ')+'.':(p.vr||'Mixed market relationship; no single bullish/bearish label fits.')}
function vegasPanel(p){return projectionBlock('Sportsbook threshold snapshot',p.vl||'No line available')+pricedMarketBlock(p)+projectionBlock('Our Projection',p.m)+projectionBlock('Consensus Projection',p.cn||'No consensus projection available')+blocks([['Our Projected PPR',fmt(p.mp,1)],['Consensus PPR',fmt(p.cp,1)]])+readBlock('Three-way read',smartVegasRead(p))}`;if(!h.includes(oldVegas))throw Error('Vegas panel patch point unavailable');h=h.replace(oldVegas,newVegas);h=h.replace('Sportsbook expectations versus our projection. Alignment with Vegas is confirmation, not a head-to-head fantasy edge.','Sportsbook threshold and two-sided O/U pricing versus both our projection and consensus. The market is calibration/context only and does not automatically change player rank.');const needle=";fill()}catch(e){document.querySelector('.wrap')";const patch=";try{let ur=await fetch('"+RAW+"current162patch-2026-08-24.json?v="+STAMP+"',{cache:'no-store'});if(ur.ok){let uj=await ur.json();let up=uj.players||{};P.forEach(p=>{let x=up[p.n];if(x)Object.assign(p,x)});P.forEach(p=>{p.s=Number((p.pd*.35+p.ce*.20+p.r*.15+p.e*.10+p.a*.10+p.rl*.05+p.su*.05).toFixed(3))})}}catch(e){console.warn('Current 162-player update unavailable',e)};try{let er=await fetch('"+RAW+"environmentSpecifics2026.json?v="+STAMP+"',{cache:'no-store'});if(er.ok){let ej=await er.json();let ep=ej.players||{};P.forEach(p=>{let x=ep[p.n];if(x&&x.environment_detail)p.enx=x.environment_detail})}}catch(e){console.warn('Player-specific environment layer unavailable',e)};try{let or=await fetch('"+RAW+"vegasOdds2026.json?v="+STAMP+"',{cache:'no-store'});if(or.ok){let oj=await or.json();let op=oj.players||{};P.forEach(p=>{if(op[p.n])p.vo=op[p.n]})}}catch(e){console.warn('Vegas O/U price layer unavailable',e)};fill()}catch(e){document.querySelector('.wrap')";if(!h.includes(needle))throw Error('Runtime patch point unavailable');h=h.replace(needle,patch);document.open();document.write(h);document.close()}catch(e){document.getElementById('boot').textContent='Player data failed to load. '+e.message;console.error(e)}})();</script></body></html>
