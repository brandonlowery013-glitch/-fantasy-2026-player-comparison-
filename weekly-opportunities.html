<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>Weekly Opportunities · Fantasy 2026 Football Model</title><style>:root{--bg:#08111f;--panel:#111c31;--panel2:#0d182a;--text:#f3f7fc;--muted:#9eb0c7;--accent:#4da3ff;--border:#2b3f60;--green:#183f2a;--orange:#513515;--red:#522129}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-wrap:anywhere}.shell{width:min(1180px,96vw);margin:0 auto;padding:18px 0 40px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:14px}.top h1{margin:0;font-size:26px}.sub,.meta{color:var(--muted);font-size:13px;line-height:1.5}.back{color:#cfe4ff;text-decoration:none;border:1px solid var(--border);border-radius:999px;padding:9px 12px;font-weight:800;min-height:44px;display:inline-flex;align-items:center}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:999px;padding:9px 13px;font-weight:800;min-height:44px}.tabs button.active{background:var(--accent);color:#06101c;border-color:var(--accent)}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.sum,.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;min-width:0}.sum span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:900}.sum b{font-size:20px}.card{margin-bottom:10px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;min-width:0}.head>div{min-width:0}.rank{font-weight:900;font-size:22px}.title{font-size:17px;font-weight:900;overflow-wrap:anywhere}.pill{display:inline-block;border:1px solid #40567e;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900;flex:0 0 auto}.HIGH{background:var(--green)}.MODERATE{background:#17334d}.LEAN{background:var(--orange)}.PASS{background:#2a2f39}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.metric{background:var(--panel2);border:1px solid #26395b;border-radius:9px;padding:8px;min-width:0}.metric span{display:block;color:#7f95b1;font-size:9px;text-transform:uppercase;font-weight:900}.metric b{display:block;margin-top:2px;overflow-wrap:anywhere}.why{margin-top:10px;color:#dce7f6;font-size:13px;line-height:1.55}.move{margin-top:8px;color:#a9bdd8;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions a{color:#d9eaff;text-decoration:none;border:1px solid #3c5784;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800;min-height:44px;display:inline-flex;align-items:center}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #3b5275;border-radius:14px;background:var(--panel2)}@media(max-width:760px){.shell{width:min(100% - 22px,1180px)}.top{display:block}.back{margin-top:10px}.summary,.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:460px){.summary,.metrics{grid-template-columns:1fr}.head{flex-wrap:wrap}.head .pill{margin-top:2px}.tabs button{flex:1 1 auto}.actions a{width:100%;justify-content:center}}</style></head><body><div class="shell"><div class="top"><div><h1>Weekly Opportunities</h1><div class="sub">Ranked model findings across weekly player props, spreads, totals and moneylines. The underlying PICK/PASS formula comes from Steps 15 and 16; this screen only organizes and explains it.</div></div><a class="back" href="index.html">Back to model</a></div><div id="summary" class="summary"></div><div class="tabs"><button id="pickTab" class="active">Picks</button><button id="nearTab">Near Misses</button></div><div id="content"></div></div><script>const RAW='https://raw.githubusercontent.com/brandonlowery013-glitch/-fantasy-2026-player-comparison-/main/';let DATA={ranked_picks:[],near_misses:[],summary:{}};const $=id=>document.getElementById(id);const pct=x=>x==null?'—':(Number(x)*100).toFixed(1)+'%';const num=(x,d=1)=>x==null?'—':Number(x).toFixed(d).replace(/\.0$/,'');function summary(){let s=DATA.summary||{};$('summary').innerHTML=`<div class="sum"><span>Week</span><b>${DATA.week??'—'}</b></div><div class="sum"><span>Game Picks</span><b>${s.game_picks??0}</b></div><div class="sum"><span>Player Prop Picks</span><b>${s.player_prop_picks??0}</b></div><div class="sum"><span>Near Misses</span><b>${s.near_misses??0}</b></div>`}function movement(x){let m=x.market_movement;if(!m)return'';if(x.entity_type==='PLAYER')return `<div class="move">Market movement: ${m.from_line??'—'} → ${m.to_line??'—'} (${m.from_captured_at||'—'} to ${m.to_captured_at||'—'})</div>`;return `<div class="move">Market movement captured from ${m.from_captured_at||'—'} to ${m.to_captured_at||'—'}.</div>`}function title(x){if(x.entity_type==='PLAYER')return `${x.player} · ${String(x.stat||'').replaceAll('_',' ')} · ${x.selection||'PASS'}`;return `${x.matchup||x.game_id} · ${x.market_type} · ${x.selection||'PASS'}`}function drill(x){if(x.entity_type==='PLAYER')return `<a href="index.html?view=profile&player=${encodeURIComponent(x.player)}">Open player profile</a>`;return `<a href="index.html?view=games&game=${encodeURIComponent(x.game_id||'')}">Open game detail</a>`}function card(x,idx,isNear){return `<article class="card"><div class="head"><div><div class="meta">${isNear?'Near miss #'+(x.watch_rank||idx+1):'Rank #'+(x.rank||idx+1)} · ${x.book||'—'}</div><div class="title">${title(x)}</div></div><span class="pill ${isNear?'PASS':(x.confidence||'LEAN')}">${isNear?'PASS':x.confidence}</span></div><div class="metrics"><div class="metric"><span>Model probability</span><b>${pct(x.model_conditional_win_probability)}</b></div><div class="metric"><span>No-vig market</span><b>${pct(x.no_vig_market_probability)}</b></div><div class="metric"><span>Probability edge</span><b>${pct(x.probability_edge)}</b></div><div class="metric"><span>Expected value</span><b>${pct(x.expected_value)}</b></div></div><div class="why">${x.explanation||'No explanation available.'}</div>${movement(x)}<div class="actions">${drill(x)}</div></article>`}function render(kind){let arr=kind==='near'?(DATA.near_misses||[]):(DATA.ranked_picks||[]);$('pickTab').classList.toggle('active',kind==='pick');$('nearTab').classList.toggle('active',kind==='near');$('content').innerHTML=arr.length?arr.map((x,i)=>card(x,i,kind==='near')).join(''):`<div class="empty">${kind==='pick'?'No weekly markets currently clear the locked PICK thresholds.':'No PASS findings are close enough to qualify for the near-miss watchlist.'}</div>`}async function load(){try{let r=await fetch(RAW+'data/market/unified-opportunities-2026.json?v=20260827-step18',{cache:'no-store'});if(!r.ok)throw Error('Opportunity ledger unavailable');DATA=await r.json();summary();render('pick')}catch(e){$('summary').innerHTML='';$('content').innerHTML=`<div class="empty">${e.message}</div>`}}$('pickTab').onclick=()=>render('pick');$('nearTab').onclick=()=>render('near');load();</script></body></html>
