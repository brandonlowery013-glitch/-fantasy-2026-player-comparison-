name: Step 19 Calibration Governance

on:
  workflow_dispatch:
  pull_request:
  push:
  schedule:
    - cron: '25 */6 * * *'

jobs:
  step19-calibration-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate calibration governance contract
        run: node scripts/validate-calibration-governance-contract.mjs
      - name: Test governance sample-floor logic
        run: node scripts/build-calibration-governance-status.mjs --self-test
      - name: Build current governance status
        run: node scripts/build-calibration-governance-status.mjs
      - name: Verify current preseason hold state
        run: node -e "const x=require('./data/calibration/calibration-governance-status-2026.json');if(x.promotion_eligible!==false||x.decision!=='HOLD')process.exit(1)"
      - name: Upload Step 19 QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step19-calibration-governance
          path: |
            guardrails/calibration-governance-contract-report.json
            data/calibration/calibration-governance-status-2026.json
