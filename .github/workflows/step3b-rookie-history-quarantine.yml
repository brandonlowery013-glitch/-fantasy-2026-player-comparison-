name: Step 3B Rookie History Quarantine

on:
  pull_request:
    paths:
      - 'historicalStats2026.json'
      - 'data/sources/rookie-no-history-inputs-2026.json'
      - 'scripts/audit-step3b-rookie-history-contamination.mjs'
      - 'scripts/validate-step3b-rookie-history-quarantine.mjs'
      - 'scripts/build-step3b-162-shadow-recalculation.mjs'
      - 'scripts/build-rookie-no-history-priors.mjs'
      - 'scripts/validate-rookie-no-history-priors.mjs'
      - '.github/workflows/step3b-rookie-history-quarantine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rookie-history-quarantine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit and quarantine invalid 2026-rookie history rows in shadow
        run: node scripts/audit-step3b-rookie-history-contamination.mjs
      - name: Run 162 shadow recalculation against sanitized history only
        run: |
          cp historicalStats2026.json /tmp/historicalStats2026.original.json
          cp guardrails/step3b-sanitized-historicalStats2026.json historicalStats2026.json
          node scripts/build-step3b-162-shadow-recalculation.mjs
          cp /tmp/historicalStats2026.original.json historicalStats2026.json
      - name: Validate rookie quarantine and 10-player no-history restoration
        run: node scripts/validate-step3b-rookie-history-quarantine.mjs
      - name: Verify tracked history file was restored exactly
        run: git diff --exit-code -- historicalStats2026.json
      - name: Build historical rookie/no-history priors for the locked 10-player set
        run: node scripts/build-rookie-no-history-priors.mjs
      - name: Validate rookie/no-history priors and sample floors
        run: node scripts/validate-rookie-no-history-priors.mjs
      - name: Run hard Guardrail QA
        run: node scripts/run-guardrail-qa.mjs
      - name: Upload rookie quarantine and prior-validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step3b-rookie-history-quarantine
          path: |
            guardrails/step3b-rookie-history-contamination-audit.json
            guardrails/step3b-sanitized-historicalStats2026.json
            guardrails/step3b-shadow-projection-context-162.json
            guardrails/step3b-shadow-projection-downstream-162.json
            guardrails/step3b-shadow-overall-review-queue-162.json
            guardrails/rookie-no-history-priors-report.json
            guardrails/rookie-no-history-priors-validation-report.json
            data/probability/generated/rookie-no-history-priors-2016-2025.json
          if-no-files-found: error
