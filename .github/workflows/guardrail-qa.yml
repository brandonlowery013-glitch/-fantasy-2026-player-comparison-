name: Guardrail QA

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  guardrail-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for drift comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run frozen baseline drift comparator
        run: node scripts/run-baseline-drift-check.mjs
      - name: Test EV and de-vig math
        run: node scripts/test-ev-math.mjs
      - name: Validate historical uncertainty schema
        run: node scripts/validate-historical-uncertainty-schema.mjs
      - name: Ingest 2021-2025 historical core game logs
        run: node scripts/ingest-historical-core.mjs
      - name: Audit core historical stats and player identities
        run: node scripts/audit-core-stats-identities.mjs
      - name: Enrich historical context and usage
        run: node scripts/enrich-historical-context.mjs
      - name: Enrich position-specific high-value usage
        run: node scripts/enrich-high-value-usage.mjs
      - name: Audit high-value usage against PFR
        run: node scripts/audit-high-value-usage.mjs
      - name: Enrich deeper leakage-safe football context
        run: node scripts/enrich-deeper-football-context.mjs
      - name: Build broad historical reference population
        run: node scripts/build-historical-reference-population.mjs
      - name: Build and validate football probability distributions
        run: node scripts/build-probability-distributions.mjs --validate
      - name: Verify EV shadow layer synchronization
        run: node scripts/build-ev-shadow-layer.mjs --check
      - name: Run hard Guardrail QA
        run: node scripts/run-guardrail-qa.mjs
      - name: Upload guardrail reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-reports
          path: |
            guardrails/baseline-drift-report.json
            guardrails/guardrail-report.json
            guardrails/probability-distribution-report.json
            guardrails/generated-ev-probability-inputs.json
            guardrails/historical-core-ingestion-report.json
            guardrails/core-stats-identity-accuracy-report.json
            guardrails/historical-context-enrichment-report.json
            guardrails/high-value-usage-report.json
            guardrails/high-value-usage-accuracy-report.json
            guardrails/deeper-football-context-report.json
            guardrails/historical-reference-population-report.json
            data/probability/generated/historical-core-2021-2025.json
            data/probability/generated/historical-enriched-2021-2025.json
            data/probability/generated/historical-reference-population-2021-2025.json
          if-no-files-found: error
