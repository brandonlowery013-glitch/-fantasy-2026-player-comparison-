name: Guardrail QA

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  guardrail-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for drift comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run frozen baseline drift comparator
        run: node scripts/run-baseline-drift-check.mjs
      - name: Test EV and de-vig math
        run: node scripts/test-ev-math.mjs
      - name: Validate historical uncertainty schema
        run: node scripts/validate-historical-uncertainty-schema.mjs
      - name: Ingest 2021-2025 historical core game logs
        run: node scripts/ingest-historical-core.mjs
      - name: Audit core historical stats and player identities
        run: node scripts/audit-core-stats-identities.mjs
      - name: Enrich historical context and usage
        run: node scripts/enrich-historical-context.mjs
      - name: Enrich position-specific high-value usage
        run: node scripts/enrich-high-value-usage.mjs
      - name: Audit high-value usage against PFR
        run: node scripts/audit-high-value-usage.mjs
      - name: Enrich deeper leakage-safe football context
        run: node scripts/enrich-deeper-football-context.mjs
      - name: Build broad historical reference population
        run: node scripts/build-historical-reference-population.mjs
      - name: Build uncertainty priors and walk-forward calibration
        run: node scripts/build-historical-uncertainty-calibration.mjs
      - name: Calibrate stat distribution families
        run: node scripts/calibrate-distribution-families.mjs
      - name: Audit frozen 2025 family calibration
        run: node scripts/audit-frozen-2025-calibration.mjs
      - name: Validate frozen 2025 calibration audit contract
        run: node scripts/validate-frozen-2025-calibration-audit.mjs
      - name: Validate historical route source contract
        run: node scripts/validate-historical-route-source-contract.mjs
      - name: Backfill observed historical WR/TE pass-play participation
        run: node scripts/backfill-historical-route-participation.mjs
      - name: Build position-specific role cohort priors
        run: node scripts/build-role-cohort-priors.mjs
      - name: Build leakage-safe catch-rate priors from role cohorts
        run: node scripts/build-catch-rate-priors.mjs
      - name: Build historical rookie/no-history priors
        run: node scripts/build-rookie-no-history-priors.mjs
      - name: Validate rookie/no-history prior contract
        run: node scripts/validate-rookie-no-history-priors.mjs
      - name: Build historical projection error model
        run: node scripts/build-historical-projection-error-model.mjs
      - name: Validate projection error model contract
        run: node scripts/validate-projection-error-model.mjs
      - name: Validate weekly football context source contract
        run: node scripts/validate-weekly-football-context-source-contract.mjs
      - name: Validate role cohort baseline selection contract
        run: node scripts/validate-role-cohort-baseline-selection.mjs
      - name: Validate weekly football context normalization and freshness
        run: node scripts/normalize-weekly-football-context.mjs --self-test
      - name: Validate weekly football projection generator
        run: node scripts/build-weekly-projection-generator.mjs --self-test
      - name: Validate weekly calibrated probability engine
        run: node scripts/build-weekly-probability-engine.mjs --self-test
      - name: Validate weekly matchup market snapshot layer
        run: node scripts/validate-weekly-matchup-market-snapshots.mjs --self-test
      - name: Build and validate football probability distributions
        run: node scripts/build-probability-distributions.mjs --validate
      - name: Verify EV shadow layer synchronization
        run: node scripts/build-ev-shadow-layer.mjs --check
      - name: Run hard Guardrail QA
        run: node scripts/run-guardrail-qa.mjs
      - name: Upload guardrail reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-reports
          path: |
            guardrails/baseline-drift-report.json
            guardrails/guardrail-report.json
            guardrails/probability-distribution-report.json
            guardrails/generated-ev-probability-inputs.json
            guardrails/historical-core-ingestion-report.json
            guardrails/core-stats-identity-accuracy-report.json
            guardrails/historical-context-enrichment-report.json
            guardrails/high-value-usage-report.json
            guardrails/high-value-usage-accuracy-report.json
            guardrails/deeper-football-context-report.json
            guardrails/historical-reference-population-report.json
            guardrails/historical-uncertainty-calibration-report.json
            guardrails/distribution-family-calibration-report.json
            guardrails/frozen-2025-calibration-audit-report.json
            guardrails/frozen-2025-calibration-audit-validation-report.json
            guardrails/catch-rate-priors-report.json
            guardrails/historical-route-source-contract-report.json
            guardrails/historical-route-participation-backfill-report.json
            guardrails/role-cohort-priors-report.json
            guardrails/role-cohort-baseline-selection-report.json
            guardrails/rookie-no-history-priors-report.json
            guardrails/rookie-no-history-priors-validation-report.json
            guardrails/historical-projection-error-model-report.json
            guardrails/projection-error-model-validation-report.json
            guardrails/weekly-football-context-source-contract-report.json
            guardrails/weekly-football-context-normalization-report.json
            guardrails/weekly-projection-generator-report.json
            guardrails/weekly-probability-engine-report.json
            guardrails/weekly-matchup-market-snapshot-report.json
            data/probability/generated/historical-core-2021-2025.json
            data/probability/generated/historical-enriched-2021-2025.json
            data/probability/generated/historical-reference-population-2021-2025.json
            data/probability/generated/historical-uncertainty-priors-2021-2025.json
            data/probability/generated/distribution-family-calibration-2021-2025.json
            data/probability/generated/frozen-2025-calibration-audit.json
            data/probability/generated/catch-rate-priors-2021-2025.json
            data/probability/generated/historical-pass-play-participation-2021-2025.json
            data/probability/generated/role-cohort-priors-2021-2025.json
            data/probability/generated/rookie-no-history-priors-2016-2025.json
            data/probability/generated/historical-projection-error-model-2021-2025.json
            data/sources/historical-route-participation-2021-2025.json
            data/sources/weekly-football-context-2026.json
            data/sources/role-cohort-baseline-selection-2026.json
            data/sources/rookie-no-history-inputs-2026.json
            data/sources/projection-error-model-2026.json
            data/sources/frozen-2025-calibration-audit-2026.json
            data/probability/weekly-football-context-raw-2026.json
            data/probability/weekly-football-context-inputs-2026.json
            data/probability/weekly-projection-inputs-2026.json
            data/probability/generated/weekly-probability-distributions-2026.json
            data/market/weekly-matchup-market-snapshots-2026.json
          if-no-files-found: error
