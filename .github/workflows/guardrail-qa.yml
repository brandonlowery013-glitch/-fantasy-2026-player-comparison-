name: Guardrail QA

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  guardrail-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for drift comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run hard guardrail QA
        run: node scripts/run-guardrail-qa.mjs
      - name: Upload guardrail report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-report
          path: guardrails/guardrail-report.json
          if-no-files-found: error
