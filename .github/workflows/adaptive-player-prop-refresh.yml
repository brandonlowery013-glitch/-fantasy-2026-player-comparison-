name: Adaptive Player Prop Refresh

on:
  pull_request:
    paths:
      - 'data/sources/live-market-ingestion-2026.json'
      - 'scripts/adaptive-player-prop-refresh.mjs'
      - '.github/workflows/adaptive-player-prop-refresh.yml'
  push:
    branches: [main]
    paths:
      - 'data/sources/live-market-ingestion-2026.json'
      - 'scripts/adaptive-player-prop-refresh.mjs'
      - '.github/workflows/adaptive-player-prop-refresh.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read

concurrency:
  group: adaptive-player-prop-refresh
  cancel-in-progress: false

jobs:
  prop-cadence-qa:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate adaptive player prop cadence
        run: node scripts/adaptive-player-prop-refresh.mjs --self-test
      - name: Validate live market ingestion contract
        run: node scripts/validate-live-market-ingestion-contract.mjs
      - name: Validate player prop snapshot contract
        run: node scripts/validate-player-prop-market-snapshots.mjs

  adaptive-player-prop-refresh:
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Discover or refresh player props when due
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/adaptive-player-prop-refresh.mjs
      - name: Validate player prop snapshots
        run: node scripts/validate-player-prop-market-snapshots.mjs
      - name: Persist adaptive player prop state through guarded PR
        id: persist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            data/market/player-prop-market-snapshots-2026.json
            data/market/adaptive-player-prop-refresh-status-2026.json
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No adaptive player-prop state changes."
            exit 0
          fi

          branch="production/adaptive-props-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m "Refresh adaptive player prop state [skip ci]"
          git push --set-upstream origin "$branch"

          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --base main --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "Production: adaptive player prop refresh" \
              --body "Automated player-prop discovery and refresh. Before T-48h, event-market availability is checked every six hours until the first prop snapshot is captured, then the game sleeps until T-48h. Active refresh is per-game kickoff: 3h at 48-24h, 90m at 24-6h, 30m at 6-1h, and 15m in the final hour. Market data remains downstream-only. Merge only after the full Guardrail QA validates the protected update target.")
            PR_NUMBER="${PR_URL##*/}"
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Opened protected player-prop update PR #${PR_NUMBER} from ${branch}."

      - name: Run Guardrail QA on exact player-prop update branch
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.persist.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL=$(gh workflow run guardrail-qa.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH")
          RUN_ID="${RUN_URL##*/}"

          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "FAIL: could not parse Guardrail QA run id from: $RUN_URL"
            exit 1
          fi

          echo "Guardrail QA run: ${RUN_ID}"
          for _ in $(seq 1 360); do
            STATUS=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
            if [ "$STATUS" = "completed" ]; then
              CONCLUSION=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
              if [ "$CONCLUSION" != "success" ]; then
                echo "FAIL: Guardrail QA concluded ${CONCLUSION}."
                exit 1
              fi
              echo "Guardrail QA passed."
              exit 0
            fi
            sleep 10
          done

          echo "FAIL: timed out waiting for Guardrail QA."
          exit 1

      - name: Merge validated player-prop state PR
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.persist.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          for _ in $(seq 1 30); do
            STATE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')
            if [ "$STATE" = "MERGED" ]; then
              echo "PR #${PR_NUMBER} already merged."
              exit 0
            fi

            if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch; then
              echo "Merged validated player-prop PR #${PR_NUMBER}."
              exit 0
            fi

            echo "Merge not ready yet; waiting for protected required checks."
            sleep 10
          done

          echo "FAIL: validated PR #${PR_NUMBER} did not become mergeable before timeout."
          exit 1
