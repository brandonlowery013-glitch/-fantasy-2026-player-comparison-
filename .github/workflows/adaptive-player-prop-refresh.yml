name: Adaptive Player Prop Refresh

on:
  pull_request:
    paths:
      - 'data/sources/live-market-ingestion-2026.json'
      - 'scripts/adaptive-player-prop-refresh.mjs'
      - 'lib/prop-player-identity.mjs'
      - 'lib/current-prop-quotes.mjs'
      - 'lib/player-prop-availability.mjs'
      - 'lib/qb-receiver-projections.mjs'
      - 'lib/distribution-tail-math.mjs'
      - 'scripts/import-cloudflare-qb-scenarios.mjs'
      - 'scripts/test-qb-receiver-projections.mjs'
      - 'scripts/test-qb-scenario-import.mjs'
      - 'scripts/test-qb-publisher-integration.mjs'
      - 'scripts/build-weekly-projection-generator.mjs'
      - 'scripts/build-weekly-probability-engine.mjs'
      - 'data/probability/generated/qb-receiver-effects-2026.json'
      - 'scripts/test-player-prop-availability.mjs'
      - 'lib/cloudflare-prop-import.mjs'
      - 'scripts/test-cloudflare-prop-import.mjs'
      - 'scripts/test-current-prop-quotes.mjs'
      - 'scripts/build-player-prop-recommendations.mjs'
      - 'scripts/test-prop-player-identity.mjs'
      - 'scripts/merge-guarded-production-pr.sh'
      - '.github/workflows/adaptive-player-prop-refresh.yml'
  push:
    branches: [main]
    paths:
      - 'data/sources/live-market-ingestion-2026.json'
      - 'scripts/adaptive-player-prop-refresh.mjs'
      - 'lib/prop-player-identity.mjs'
      - 'lib/current-prop-quotes.mjs'
      - 'lib/player-prop-availability.mjs'
      - 'lib/qb-receiver-projections.mjs'
      - 'lib/distribution-tail-math.mjs'
      - 'scripts/import-cloudflare-qb-scenarios.mjs'
      - 'scripts/test-qb-receiver-projections.mjs'
      - 'scripts/test-qb-scenario-import.mjs'
      - 'scripts/test-qb-publisher-integration.mjs'
      - 'scripts/build-weekly-projection-generator.mjs'
      - 'scripts/build-weekly-probability-engine.mjs'
      - 'data/probability/generated/qb-receiver-effects-2026.json'
      - 'scripts/test-player-prop-availability.mjs'
      - 'lib/cloudflare-prop-import.mjs'
      - 'scripts/test-cloudflare-prop-import.mjs'
      - 'scripts/test-current-prop-quotes.mjs'
      - 'scripts/build-player-prop-recommendations.mjs'
      - 'scripts/test-prop-player-identity.mjs'
      - 'scripts/merge-guarded-production-pr.sh'
      - '.github/workflows/adaptive-player-prop-refresh.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: Optional run ID containing captured-player-prop-state; reuse valid quotes without another provider request
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read

concurrency:
  group: adaptive-player-prop-refresh
  cancel-in-progress: false

jobs:
  prop-cadence-qa:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate adaptive player prop cadence
        run: |
          node scripts/adaptive-player-prop-refresh.mjs --self-test
          node scripts/test-prop-player-identity.mjs
          node scripts/test-current-prop-quotes.mjs
          node scripts/test-player-prop-availability.mjs
          node scripts/test-qb-receiver-projections.mjs
          node scripts/test-qb-scenario-import.mjs
          node scripts/test-qb-publisher-integration.mjs
          node scripts/test-cloudflare-prop-import.mjs
          node scripts/build-player-prop-recommendations.mjs --self-test
          node scripts/test-issued-history-storage.mjs
          node scripts/test-market-ingestion-settings.mjs
          node scripts/test-prop-board-quotes.mjs
          node scripts/test-prop-board-model.mjs
          node scripts/test-prop-coverage-recovery.mjs
      - name: Validate live market ingestion contract
        run: node scripts/validate-live-market-ingestion-contract.mjs
      - name: Validate player prop snapshot contract
        run: node scripts/validate-player-prop-market-snapshots.mjs

  adaptive-player-prop-refresh:
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: production-main-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore previously captured quotes for a publication recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: captured-player-prop-state
          path: data/market
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.recovery_run_id }}
      - name: Validate restored quote identity and original timestamps
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_run_id != ''
        run: node scripts/validate-prop-artifact-recovery.mjs
      - name: Import Cloudflare scheduled quotes for model evaluation
        if: github.event_name != 'workflow_dispatch' || inputs.recovery_run_id == ''
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/adaptive-player-prop-refresh.mjs
      - name: Import scheduled QB replacement scenarios
        run: node scripts/import-cloudflare-qb-scenarios.mjs
      - name: Preserve original scheduled quotes for publication recovery
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captured-player-prop-state
          retention-days: 3
          path: |
            data/market/player-prop-market-snapshots-2026.json
            data/market/adaptive-player-prop-refresh-status-2026.json
            data/market/cloudflare-player-prop-current-2026.json
      - name: Validate player prop snapshots
        run: node scripts/validate-player-prop-market-snapshots.mjs
      - name: Rebuild website outputs when prop quotes change
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ] && git diff --quiet -- data/market/player-prop-market-snapshots-2026.json && git diff --quiet -- data/market/cloudflare-player-prop-current-2026.json data/ingestion/current-quarterback-scenarios-2026.json && [ -z "$(git ls-files --others --exclude-standard -- data/market/cloudflare-player-prop-current-2026.json data/ingestion/current-quarterback-scenarios-2026.json)" ]; then
            echo 'No prop quote changes; retaining validated website outputs.'
            exit 0
          fi
          node scripts/build-weekly-projection-generator.mjs
          node scripts/build-weekly-probability-engine.mjs
          node scripts/build-player-prop-recommendations.mjs
          node scripts/build-unified-opportunity-engine.mjs
          node scripts/build-weekly-parlay-recommendations.mjs
          node scripts/build-final-betting-ui-feed.mjs
          node scripts/validate-final-betting-pipeline-step4.mjs
      - name: Persist adaptive player prop state through guarded PR
        id: persist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          paths=(data/market/player-prop-board-model-2026.json data/market/player-prop-board-quotes-2026.json data/ingestion/current-quarterback-scenarios-2026.json data/probability/weekly-projection-inputs-2026.json data/probability/generated/weekly-probability-distributions-2026.json data/market/cloudflare-player-prop-current-2026.json data/market/browser-pick-history-2026.json data/market/player-prop-market-snapshots-2026.json data/market/adaptive-player-prop-refresh-status-2026.json data/market/player-prop-recommendations-2026.json data/market/unified-opportunities-2026.json data/market/parlay-recommendations-2026.json data/market/final-betting-ui-feed-2026.json data/market/issued-pick-history-2026.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="production/adaptive-props-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m "Refresh adaptive player prop state [skip ci]"
          git push --set-upstream origin "$branch"
          PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Production: adaptive player prop refresh" --body "Automated player-prop refresh. Merge only after Guardrail QA validates the current protected target.")
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"
      - name: Validate current protected candidate and merge player-prop state
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/merge-guarded-production-pr.sh "${{ steps.persist.outputs.pr_number }}" "${{ steps.persist.outputs.branch }}" squash

