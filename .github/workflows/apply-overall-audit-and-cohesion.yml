name: Apply approved Overall audit and final cohesion

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate review gate and apply approved Overall Board moves
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path

          shard_files=sorted(Path('.').glob('players*.json'),key=lambda p:int(re.search(r'(\d+)',p.stem).group(1)))
          shards={f:json.loads(f.read_text()) for f in shard_files}
          players=[p for arr in shards.values() for p in arr]
          player_count=len(players)
          if player_count != 162:
              raise SystemExit(f'APPLY BLOCKED: expected current 162-player universe, got {player_count}')
          by_name={p['n']:p for p in players}
          if len(by_name) != player_count:
              raise SystemExit('APPLY BLOCKED: duplicate player names in active universe')

          decision_doc=json.loads(Path('overall-rank-audit-decisions.json').read_text())
          decision_universe=decision_doc.get('universe_size')
          approval_status=decision_doc.get('approval_status')
          if decision_universe != player_count:
              raise SystemExit(f'APPLY BLOCKED: decision audit universe_size={decision_universe!r}; active universe={player_count}. Generate a fresh 162-player review set first.')
          if approval_status != 'APPROVED_FOR_APPLY':
              raise SystemExit(f'APPLY BLOCKED: approval_status={approval_status!r}; explicit approved review gate is required.')

          decisions=decision_doc.get('decisions',[])
          if not decisions:
              raise SystemExit('APPLY BLOCKED: no approved Overall decisions found')
          missing=[d.get('name') for d in decisions if d.get('name') not in by_name]
          if missing:
              raise SystemExit(f'APPLY BLOCKED: decision players missing from active universe: {missing}')

          old_order=sorted(players,key=lambda p:(p['o'],p['n']))
          old_rank={p['n']:p['o'] for p in players}
          old_ppr={p['n']:p.get('mp') for p in players}
          old_tr={p['n']:p.get('tr') for p in players}
          target={p['n']:float(p['o']) for p in players}
          for d in decisions:
              if d.get('decision')!='HOLD': target[d['name']]=float(d['proposed'])
          stable_index={p['n']:i for i,p in enumerate(old_order)}
          new_order=sorted(players,key=lambda p:(target[p['n']],stable_index[p['n']]))
          for i,p in enumerate(new_order,1): p['o']=i

          pos_counts={}
          for p in new_order:
              pos_counts[p['p']]=pos_counts.get(p['p'],0)+1
              p['pr']=f"{p['p']}{pos_counts[p['p']]}"

          # Overall apply may not mutate Player Quality rank/score or projections.
          tr_sorted=sorted(players,key=lambda p:(p.get('tr',9999),p['n']))
          tv_counts={}
          for p in tr_sorted:
              tv_counts[p['p']]=tv_counts.get(p['p'],0)+1
              p['tp']=f"{p['p']}{tv_counts[p['p']]}"

          for f,arr in shards.items():
              f.write_text(json.dumps([by_name[p['n']] for p in arr],separators=(',',':'))+'\n')

          keep=['n','p','t','o','pr','tr','tp','s','pd','ce','r','e','a','rl','su','mp','m','cl','px','fw','st','ns','nm','na','en','ad','cp','cn','vl','vs','vr']
          def slim(p): return {k:p[k] for k in keep if k in p}
          canonical={
              'updated':decision_doc.get('approved_at') or decision_doc.get('as_of'),
              'active_players':player_count,
              'weights':{'Expected Production':.35,'Ceiling':.20,'Role/Volume':.15,'Offensive Environment':.10,'Availability':.10,'Weekly Reliability':.05,'Sustainability':.05},
              'overall':[slim(p) for p in sorted(players,key=lambda p:(p['o'],p['n']))],
              'trueValue':[slim(p) for p in sorted(players,key=lambda p:(p['tr'],p['n']))],
              'positions':{pos:[slim(p) for p in sorted([x for x in players if x['p']==pos],key=lambda p:(p['tr'],p['n']))] for pos in ['QB','RB','WR','TE']}
          }
          Path('canonicalBoards2026.json').write_text(json.dumps(canonical,indent=2)+'\n')

          errors=[]
          expected=list(range(1,player_count+1))
          ranks=sorted(p['o'] for p in players)
          tranks=sorted(p['tr'] for p in players)
          if ranks!=expected: errors.append(f'Overall ranks are not unique/continuous 1-{player_count}')
          if tranks!=expected: errors.append(f'Player Quality ranks are not unique/continuous 1-{player_count}')
          if any(old_ppr[n]!=by_name[n].get('mp') for n in by_name): errors.append('Projection changed during Overall-only apply')
          if any(old_tr[n]!=by_name[n].get('tr') for n in by_name): errors.append('Player Quality rank changed during Overall-only apply')
          can_by={p['n']:p for p in canonical['overall']}
          if len(can_by)!=player_count: errors.append('canonical Overall player count mismatch')
          for n,p in by_name.items():
              if can_by.get(n,{}).get('o')!=p['o']: errors.append(f'canonical Overall mismatch: {n}')

          rows=[]
          for d in decisions:
              p=by_name[d['name']]
              rows.append({'name':d['name'],'decision':d['decision'],'old_overall':old_rank[d['name']],
                           'audit_target':d.get('proposed'),'final_overall':p['o'],'final_pos_rank':p['pr'],
                           'player_quality_rank':p['tr'],'projected_ppr':p.get('mp'),'reason':d.get('reason')})
          report={
              'as_of':decision_doc.get('approved_at') or decision_doc.get('as_of'),
              'players_checked':player_count,
              'audit_decisions':len(decisions),
              'decision_universe_size':decision_universe,
              'approval_status':approval_status,
              'overall_rank_unique':ranks==expected,
              'player_quality_rank_unique':tranks==expected,
              'projections_unchanged_during_reorder':not any(old_ppr[n]!=by_name[n].get('mp') for n in by_name),
              'player_quality_unchanged_during_overall_reorder':not any(old_tr[n]!=by_name[n].get('tr') for n in by_name),
              'canonical_overall_synced':not any(can_by.get(n,{}).get('o')!=p['o'] for n,p in by_name.items()),
              'errors':errors,'decisions':rows
          }
          Path('final-cohesion-check-current.json').write_text(json.dumps(report,indent=2)+'\n')
          if errors: raise SystemExit('FINAL COHESION FAILED: '+'; '.join(errors))
          print(f'FINAL COHESION PASS — {player_count} players / {len(decisions)} approved decisions')
          PY
      - name: Commit approved synchronized board and QA
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add players*.json canonicalBoards2026.json final-cohesion-check-current.json
          git diff --cached --quiet || git commit -m 'Apply approved 162-player Overall audit [skip ci]'
          git push
