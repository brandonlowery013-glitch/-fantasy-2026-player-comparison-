name: Step 3B Bayesian Walk-Forward Backtest

on:
  pull_request:
    paths:
      - 'historicalStats2026.json'
      - 'history-alias-reconciliation-audit.json'
      - 'players*.json'
      - 'scripts/backtest-step3b-bayesian-shrinkage.mjs'
      - 'scripts/validate-step3b-bayesian-walkforward-backtest.mjs'
      - 'scripts/backtest-step3b-bayesian-distribution.mjs'
      - 'scripts/validate-step3b-bayesian-distribution-backtest.mjs'
      - 'scripts/backtest-step3b-bayesian-conformal.mjs'
      - 'scripts/validate-step3b-bayesian-conformal-backtest.mjs'
      - 'scripts/backtest-step3b-bayesian-subgroups.mjs'
      - 'scripts/validate-step3b-bayesian-subgroup-backtest.mjs'
      - 'scripts/backtest-step3b-bayesian-asymmetric-guardrail.mjs'
      - 'scripts/validate-step3b-bayesian-asymmetric-guardrail-backtest.mjs'
      - 'scripts/backtest-step3b-bayesian-constrained-guardrail.mjs'
      - 'scripts/validate-step3b-bayesian-constrained-guardrail-backtest.mjs'
      - '.github/workflows/step3b-bayesian-walkforward-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bayesian-walkforward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Bayesian walk-forward Phase 1 backtest
        run: node scripts/backtest-step3b-bayesian-shrinkage.mjs
      - name: Validate Bayesian walk-forward report
        run: node scripts/validate-step3b-bayesian-walkforward-backtest.mjs
      - name: Run Bayesian Gaussian distribution Phase 2 backtest
        run: node scripts/backtest-step3b-bayesian-distribution.mjs
      - name: Validate Bayesian Gaussian distribution report
        run: node scripts/validate-step3b-bayesian-distribution-backtest.mjs
      - name: Run Bayesian empirical/conformal distribution Phase 2B backtest
        run: node scripts/backtest-step3b-bayesian-conformal.mjs
      - name: Validate Bayesian empirical/conformal distribution report
        run: node scripts/validate-step3b-bayesian-conformal-backtest.mjs
      - name: Run Bayesian subgroup/adaptive Phase 3 backtest
        run: node scripts/backtest-step3b-bayesian-subgroups.mjs
      - name: Validate Bayesian subgroup/adaptive report
        run: node scripts/validate-step3b-bayesian-subgroup-backtest.mjs
      - name: Run Bayesian asymmetric guardrail Phase 3B backtest
        run: node scripts/backtest-step3b-bayesian-asymmetric-guardrail.mjs
      - name: Validate Bayesian asymmetric guardrail report
        run: node scripts/validate-step3b-bayesian-asymmetric-guardrail-backtest.mjs
      - name: Run Bayesian constrained elite-tail Phase 3C backtest
        run: node scripts/backtest-step3b-bayesian-constrained-guardrail.mjs
      - name: Validate Bayesian constrained elite-tail report
        run: node scripts/validate-step3b-bayesian-constrained-guardrail-backtest.mjs
      - name: Run hard Guardrail QA
        run: node scripts/run-guardrail-qa.mjs
      - name: Upload Bayesian validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step3b-bayesian-walkforward-backtest
          path: |
            guardrails/step3b-bayesian-walkforward-backtest.json
            guardrails/step3b-bayesian-distribution-backtest.json
            guardrails/step3b-bayesian-conformal-backtest.json
            guardrails/step3b-bayesian-subgroup-backtest.json
            guardrails/step3b-bayesian-asymmetric-guardrail-backtest.json
            guardrails/step3b-bayesian-constrained-guardrail-backtest.json
          if-no-files-found: error
