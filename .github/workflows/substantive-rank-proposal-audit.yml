name: Substantive Rank Proposal Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build-substantive-component-recalculation.mjs'
      - 'scripts/build-substantive-rank-proposals.mjs'
      - 'scripts/collect-substantive-football-context.mjs'
      - 'scripts/ingest-weekly-football-data.mjs'
      - 'scripts/normalize-weekly-football-context.mjs'
      - 'scripts/build-weekly-projection-generator.mjs'
      - '.github/workflows/substantive-rank-proposal-audit.yml'
      - '.github/workflows/build-overall-rank-audit-context.yml'
      - '.github/workflows/apply-overall-audit-and-cohesion.yml'
      - 'MODEL_SOURCE_OF_TRUTH.json'
      - 'players*.json'
      - 'guardrails/current-football-review.json'
      - 'data/probability/weekly-football-context-inputs-2026.json'
      - 'data/probability/weekly-projection-inputs-2026.json'

permissions:
  contents: read
  actions: read

jobs:
  proposal-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Hydrate latest verified live football review when ledger is absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f guardrails/current-football-review.json ]; then
            echo 'Using repository current-football-review ledger.'
            exit 0
          fi
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/live-full-universe-football-review.yml/runs?status=success&per_page=20" --jq '.workflow_runs[] | .id' 2>/dev/null | head -n 1 || true)"
          test -n "$run_id"
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[] | select(.name=="live-full-universe-football-review" and .expired==false) | .id' 2>/dev/null | head -n 1 || true)"
          test -n "$artifact_id"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/live-review.zip
          rm -rf /tmp/live-review && mkdir -p /tmp/live-review
          unzip -q /tmp/live-review.zip -d /tmp/live-review
          test -f /tmp/live-review/current-football-review.json
          mkdir -p guardrails
          cp /tmp/live-review/current-football-review.json guardrails/current-football-review.json
          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('MODEL_SOURCE_OF_TRUTH.json','utf8'));
          const review=JSON.parse(fs.readFileSync('guardrails/current-football-review.json','utf8'));
          if(review.active_player_count!==Number(src.active_player_model)) throw new Error(`Live review player count ${review.active_player_count} != source of truth ${src.active_player_model}`);
          if(review.active_player_shards!==Number(src.runtime_player_shards)) throw new Error(`Live review shard count ${review.active_player_shards} != source of truth ${src.runtime_player_shards}`);
          if(review.review_scope!=='FULL_ACTIVE_UNIVERSE_PLUS_CONNECTED') throw new Error(`Unexpected live review scope ${review.review_scope}`);
          if((review.players||[]).length!==Number(src.active_player_model)) throw new Error('Live review does not contain every active player');
          console.log(`Hydrated verified live review: ${review.active_player_count} players, completed ${review.sweep_completed_at}`);
          NODE
      - name: Refresh current structured football evidence
        run: |
          node scripts/collect-substantive-football-context.mjs
          node scripts/ingest-weekly-football-data.mjs
          node scripts/normalize-weekly-football-context.mjs
          node scripts/build-weekly-projection-generator.mjs
      - name: Enforce nonzero live evidence coverage
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('MODEL_SOURCE_OF_TRUTH.json','utf8'));
          const collect=JSON.parse(fs.readFileSync('guardrails/substantive-football-context-collection-report.json','utf8'));
          const norm=JSON.parse(fs.readFileSync('guardrails/weekly-football-context-normalization-report.json','utf8'));
          const proj=JSON.parse(fs.readFileSync('guardrails/weekly-projection-generator-report.json','utf8'));
          if(collect.result!=='PASS') throw new Error('Substantive collector did not PASS');
          if(Number(collect.total_depth_rows)<160) throw new Error(`Depth coverage too low: ${collect.total_depth_rows}`);
          if(Number(collect.unique_tracked_players_with_signals)<80) throw new Error(`Tracked live signal coverage too low: ${collect.unique_tracked_players_with_signals}/${src.active_player_model}`);
          if(Number(norm.players)<=0) throw new Error('Normalizer produced zero players');
          if(Number(norm.current_signals)<=0) throw new Error('Normalizer produced zero current signals');
          if(Number(proj.projected_stats)<=0) throw new Error('Projection generator produced zero projected stats');
          console.log(JSON.stringify({collector_players:collect.unique_tracked_players_with_signals,normalized_players:norm.players,current_signals:norm.current_signals,projected_stats:proj.projected_stats},null,2));
          NODE
      - name: Build evidence-gated component recalculation
        run: node scripts/build-substantive-component-recalculation.mjs
      - name: Build non-authoritative substantive proposals
        run: node scripts/build-substantive-rank-proposals.mjs
      - name: Prove substantive audit did not mutate canonical model files
        run: |
          if ! git diff --quiet -- players*.json MODEL_SOURCE_OF_TRUTH.json canonicalBoards2026.json; then
            echo 'Substantive audit illegally mutated canonical model files.'
            git diff -- players*.json MODEL_SOURCE_OF_TRUTH.json canonicalBoards2026.json
            exit 1
          fi
      - name: Upload proposal audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: substantive-rank-proposal-audit
          path: |
            analysis/substantive-component-recalculation-current.json
            analysis/substantive-component-recalculation-current.md
            analysis/substantive-rank-proposals-current.json
            analysis/substantive-rank-proposals-current.md
            guardrails/substantive-football-context-collection-report.json
            guardrails/weekly-football-context-normalization-report.json
            guardrails/weekly-projection-generator-report.json
          if-no-files-found: warn
