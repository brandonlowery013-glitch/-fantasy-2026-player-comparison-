name: Step 3B Distribution Alternatives

on:
  pull_request:
    paths:
      - 'scripts/backtest-step3b-distribution-alternatives.mjs'
      - 'scripts/validate-step3b-distribution-alternatives.mjs'
      - 'scripts/backtest-step3b-distribution-heavy-tail.mjs'
      - 'scripts/validate-step3b-distribution-heavy-tail.mjs'
      - 'scripts/backtest-step3b-distribution-conformal-recalibration.mjs'
      - 'scripts/validate-step3b-distribution-conformal-recalibration.mjs'
      - 'scripts/backtest-step3b-distribution-broad-reference.mjs'
      - 'scripts/validate-step3b-distribution-broad-reference.mjs'
      - 'scripts/audit-step3b-q50-by-year-outliers.mjs'
      - 'scripts/audit-step3b-expanded-holdouts-regimes.mjs'
      - 'scripts/backtest-step3b-qb-regime-aware-median.mjs'
      - 'scripts/backtest-step3b-qb-smoothed-median.mjs'
      - 'scripts/backtest-step3b-rb-smoothed-median.mjs'
      - 'scripts/backtest-step3b-rb-robust-history-median.mjs'
      - 'scripts/audit-step3b-rb-2022-composition.mjs'
      - 'scripts/audit-step3b-rb-health-composition-2021-2025.mjs'
      - 'scripts/validate-step3b-closure.mjs'
      - '.github/workflows/step3b-distribution-alternatives.yml'
      - 'data/sources/step3b-final-decision-2026.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution-alternatives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild historical core
        run: node scripts/ingest-historical-core.mjs
      - name: Rebuild injury and role context
        run: node scripts/enrich-historical-context.mjs
      - name: Backtest empirical and scaled distributions
        run: node scripts/backtest-step3b-distribution-alternatives.mjs
      - name: Validate empirical and scaled distributions
        run: node scripts/validate-step3b-distribution-alternatives.mjs
      - name: Backtest heavy-tail distributions
        run: node scripts/backtest-step3b-distribution-heavy-tail.mjs
      - name: Validate heavy-tail distributions
        run: node scripts/validate-step3b-distribution-heavy-tail.mjs
      - name: Backtest conformal quantile recalibration
        run: node scripts/backtest-step3b-distribution-conformal-recalibration.mjs
      - name: Validate conformal quantile recalibration
        run: node scripts/validate-step3b-distribution-conformal-recalibration.mjs
      - name: Build broad historical reference population
        run: node scripts/build-historical-reference-population.mjs
      - name: Backtest conformal candidate on broad reference
        run: node scripts/backtest-step3b-distribution-broad-reference.mjs
      - name: Validate broad-reference robustness
        run: node scripts/validate-step3b-distribution-broad-reference.mjs
      - name: Audit Q50 by year and player outliers
        run: node scripts/audit-step3b-q50-by-year-outliers.mjs
      - name: Audit 2021-2025 holdouts by role regime
        run: node scripts/audit-step3b-expanded-holdouts-regimes.mjs
      - name: Backtest regime-aware QB median
        run: node scripts/backtest-step3b-qb-regime-aware-median.mjs
      - name: Backtest smoothed QB median
        run: node scripts/backtest-step3b-qb-smoothed-median.mjs
      - name: Backtest smoothed RB median
        run: node scripts/backtest-step3b-rb-smoothed-median.mjs
      - name: Backtest robust-history RB median
        run: node scripts/backtest-step3b-rb-robust-history-median.mjs
      - name: Audit 2022 RB composition and health
        run: node scripts/audit-step3b-rb-2022-composition.mjs
      - name: Audit 2021-2025 RB health composition
        run: node scripts/audit-step3b-rb-health-composition-2021-2025.mjs
      - name: Validate substantive Step 3B closure
        run: node scripts/validate-step3b-closure.mjs
      - name: Run hard Guardrail QA
        run: node scripts/run-guardrail-qa.mjs
      - name: Upload distribution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step3b-distribution-alternatives
          path: |
            guardrails/step3b-distribution-alternatives.json
            guardrails/step3b-distribution-heavy-tail.json
            guardrails/step3b-distribution-conformal-recalibration.json
            guardrails/step3b-distribution-broad-reference.json
            guardrails/step3b-q50-year-outlier-audit.json
            guardrails/step3b-expanded-holdout-regime-audit.json
            guardrails/step3b-qb-regime-aware-median.json
            guardrails/step3b-qb-smoothed-median.json
            guardrails/step3b-rb-smoothed-median.json
            guardrails/step3b-rb-robust-history-median.json
            guardrails/step3b-rb-2022-composition-diagnostic.json
            guardrails/step3b-rb-health-composition-2021-2025.json
            guardrails/step3b-closure.json
          if-no-files-found: error
