name: Guardrail Protected PR Dispatch

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-protected-guardrail:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Guardrail against exact PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run guardrail-qa.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
          echo "Dispatched protected Guardrail QA for ${HEAD_REF}; Guardrail resolves and validates the current synthetic merge before publishing required checks."
