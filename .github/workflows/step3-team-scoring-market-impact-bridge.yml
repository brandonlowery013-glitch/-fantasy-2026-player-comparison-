name: Step 3 Team Scoring Market Impact Bridge

on:
  workflow_dispatch:
  pull_request:
  workflow_run:
    workflows:
      - Step 2 Connected Impact Resolver
      - Step 23 Live Market Ingestion
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'workflow_run'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate football-first bridge contract
        run: node scripts/validate-team-scoring-market-impact-bridge.mjs
      - name: Self-test team scoring and market comparison routing
        run: node scripts/build-team-scoring-market-impact-bridge.mjs --self-test
      - name: Revalidate connected-impact resolver contract
        run: node scripts/validate-connected-impact-resolver.mjs
      - name: Revalidate model foundation
        run: node scripts/validate-model-foundation-contract.mjs

  refresh:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'workflow_run'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: write
    concurrency:
      group: production-main-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build team scoring and market impact bridge
        run: node scripts/build-team-scoring-market-impact-bridge.mjs
      - name: Publish exact validated impact state through guarded PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-guarded-impact-state.sh bridge
