name: Live News Model Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'
  pull_request:
    paths:
      - 'scripts/adjudicate-live-news-current-model.mjs'
      - 'scripts/apply-live-news-to-current-model.mjs'
      - '.github/workflows/live-news-model-ingestion.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/adjudicate-live-news-current-model.mjs'
      - 'scripts/apply-live-news-to-current-model.mjs'
      - '.github/workflows/live-news-model-ingestion.yml'

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: live-news-model-ingestion-production
  cancel-in-progress: false

jobs:
  live-news-model-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Hard-lock canonical universe to 166
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('MODEL_SOURCE_OF_TRUTH.json','utf8'));
          if(Number(src.active_player_model)!==166) throw new Error(`Expected canonical universe 166, got ${src.active_player_model}`);
          let names=[];
          for(let i=0;i<Number(src.runtime_player_shards);i++) names.push(...require(`./players${i}.json`).map(p=>p.n));
          if(names.length!==166||new Set(names).size!==166) throw new Error(`Loaded player universe ${names.length}/${new Set(names).size}, expected 166/166`);
          console.log(JSON.stringify({result:'PASS',players:166,shards:src.runtime_player_shards},null,2));
          NODE

      - name: Reconcile any in-flight accepted canonical news state
        if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='production/live-news-model-current'
          PATCH=$(node -p "require('./MODEL_SOURCE_OF_TRUTH.json').current_update_layer")
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
            OPEN_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&head=${OWNER}:${BRANCH}" --jq '.[0].number // empty')
            if [ -n "$OPEN_NUMBER" ]; then
              git checkout "refs/remotes/origin/$BRANCH" -- "$PATCH"
              echo "Reconciled canonical current-update layer from in-flight persistence PR #${OPEN_NUMBER}."
            else
              echo 'Stable persistence branch exists without an open PR; main remains the reconciliation source.'
            fi
          else
            echo 'No in-flight persistence branch; main is the reconciliation source.'
          fi

      - name: Collect current live football news and context
        run: |
          node scripts/build-live-full-universe-review-v2.mjs
          node scripts/normalize-nfl-article-bodies.mjs
          node scripts/filter-live-review-materiality.mjs
          node scripts/build-transition-intelligence-review.mjs
          node scripts/enrich-transition-from-unified-evidence.mjs
          node scripts/integrate-transition-intelligence.mjs

      - name: Validate tracked 166-player review coverage
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('MODEL_SOURCE_OF_TRUTH.json','utf8'));
          let canonical=[];
          for(let i=0;i<Number(src.runtime_player_shards);i++) canonical.push(...require(`./players${i}.json`).map(p=>p.n));
          const review=JSON.parse(fs.readFileSync('guardrails/current-football-review.json','utf8'));
          const rows=review.players||[];
          const names=rows.map(x=>x.player);
          const nameSet=new Set(names),canonicalSet=new Set(canonical);
          const missing=canonical.filter(x=>!nameSet.has(x));
          const extra=names.filter(x=>!canonicalSet.has(x));
          if(canonical.length!==166||canonicalSet.size!==166) throw new Error('Canonical 166-player universe invalid');
          if(rows.length!==166||nameSet.size!==166||missing.length||extra.length) throw new Error(`Tracked review coverage failed: rows=${rows.length}, unique=${nameSet.size}, missing=${missing.join(', ')}, extra=${extra.join(', ')}`);
          if(review.materiality_filter?.name_collision_regression_tests!==true||review.source_quality?.name_collision_regression_tests!==true) throw new Error('Name-collision regression guard did not run');
          if(Number(review.source_quality?.espn_player_news_calls)<150) throw new Error(`ESPN player-news coverage too low: ${review.source_quality?.espn_player_news_calls}`);
          if(Number(review.source_quality?.espn_modeled_athlete_ids_resolved)<150) throw new Error(`Modeled ESPN athlete-ID coverage too low: ${review.source_quality?.espn_modeled_athlete_ids_resolved}`);
          for(const r of rows){if(!r.reviewed_at)throw new Error(`${r.player} missing reviewed_at`);if(!Array.isArray(r.categories_checked)||!r.categories_checked.length)throw new Error(`${r.player} missing categories_checked`);}
          console.log(JSON.stringify({result:'PASS',tracked_players:166,untracked_admissions:'NON_BLOCKING_IN_THIS_WORKFLOW'},null,2));
          NODE

      - name: Build quantitative evidence and autonomous model decisions
        run: |
          node scripts/test-substantive-football-context-parser.mjs
          node scripts/collect-substantive-football-context.mjs
          node scripts/build-substantive-football-context-inputs.mjs
          node scripts/build-substantive-component-recalculation-v2.mjs
          node scripts/build-full-universe-reconciliation-taxonomy.mjs
          node scripts/adjudicate-live-news-current-model.mjs

      - name: Apply adjudicated decisions to canonical current-model layer
        run: node scripts/apply-live-news-to-current-model.mjs

      - name: Verify decision write, self-audit, and interface isolation
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('MODEL_SOURCE_OF_TRUTH.json','utf8'));
          const report=JSON.parse(fs.readFileSync('guardrails/live-news-model-application-report.json','utf8'));
          const decisions=JSON.parse(fs.readFileSync('analysis/live-news-decision-audit-current.json','utf8'));
          const patch=JSON.parse(fs.readFileSync(src.current_update_layer,'utf8'));
          if(report.result!=='PASS'||report.universe!==166||report.decision_self_audit!=='PASS') throw new Error('Live news decision application did not PASS for 166 players');
          if(decisions.universe!==166||decisions.counts?.self_audit_errors!==0) throw new Error('Decision self-audit did not PASS');
          if(patch.live_news_model_sync?.players!==166||patch.live_news_model_sync?.decision_policy!=='DECIDE_THEN_SELF_AUDIT') throw new Error('Canonical current-model layer did not receive decision sync');
          const rows=Object.values(patch.players||{});
          if(rows.length!==166) throw new Error(`Current-model layer coverage ${rows.length}/166`);
          if(rows.some(p=>!p.currentModelImpact||!p.currentModelDecision||!p.newsFeedState)) throw new Error('At least one player lacks currentModelImpact/currentModelDecision/newsFeedState after ingestion');
          const material=rows.filter(p=>p.currentModelImpact.material);
          if(material.some(p=>p.currentModelDecision.status!=='ADJUDICATED'||p.currentModelDecision.self_audit!=='PASS')) throw new Error('At least one material update reached persistence without an adjudicated PASS decision');
          console.log(JSON.stringify(report,null,2));
          NODE
          if ! git diff --quiet -- players*.json canonicalBoards2026.json index.html; then
            echo 'FAIL: live-news decision layer touched static player evaluations, canonical boards, or interface.'
            git diff -- players*.json canonicalBoards2026.json index.html
            exit 1
          fi

      - name: Run hard guardrail QA
        run: node scripts/run-guardrail-qa.mjs

      - name: Upload live-decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-news-model-ingestion-166
          path: |
            guardrails/current-football-review.json
            guardrails/live-news-model-application-report.json
            analysis/substantive-component-recalculation-current.json
            analysis/full-universe-reconciliation-taxonomy-current.json
            analysis/live-news-decision-audit-current.json
            current162patch-2026-08-24.json
          if-no-files-found: error

      - name: Persist validated model-news decision update through protected PR
        id: persist
        if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PATCH=$(node -p "require('./MODEL_SOURCE_OF_TRUTH.json').current_update_layer")
          FILES=("$PATCH" guardrails/live-news-model-application-report.json guardrails/current-football-review.json analysis/substantive-component-recalculation-current.json analysis/full-universe-reconciliation-taxonomy-current.json analysis/live-news-decision-audit-current.json)
          BRANCH='production/live-news-model-current'
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          BODY="Automated live-news ingestion for the canonical 166-player model. Material evidence is converted into an explicit current-model decision, self-audited, Guardrail-QA validated, and persisted. Static player evaluations, canonical boards, and CTD interface are not mutated. Latest source run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          EXISTING_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&head=${OWNER}:${BRANCH}" --jq '.[0].number // empty')
          if [ -z "$(git status --porcelain -- "${FILES[@]}")" ]; then
            if [ -n "$EXISTING_NUMBER" ]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${EXISTING_NUMBER}" -f body="$BODY" >/dev/null
              gh workflow run guardrail-qa.yml --ref "$BRANCH"
              PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${EXISTING_NUMBER}"
              echo 'changed=true' >> "$GITHUB_OUTPUT";echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT";echo "pr_number=$EXISTING_NUMBER" >> "$GITHUB_OUTPUT"
            else
              echo 'No persistence changes; latest committed news/model decision state remains canonical.';echo 'changed=false' >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH";fi
          git checkout -B "$BRANCH"
          git add -- "${FILES[@]}"
          if git diff --cached --quiet; then
            if [ -n "$EXISTING_NUMBER" ]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${EXISTING_NUMBER}" -f body="$BODY" >/dev/null
              gh workflow run guardrail-qa.yml --ref "$BRANCH"
              PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${EXISTING_NUMBER}"
              echo 'changed=true' >> "$GITHUB_OUTPUT";echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT";echo "pr_number=$EXISTING_NUMBER" >> "$GITHUB_OUTPUT"
            else echo 'changed=false' >> "$GITHUB_OUTPUT";fi
            exit 0
          fi
          git commit -m "Persist live 166-player news model decisions"
          git push --force-with-lease --set-upstream origin "$BRANCH"
          if [ -n "$EXISTING_NUMBER" ]; then PR_NUMBER="$EXISTING_NUMBER";gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -f body="$BODY" >/dev/null;else PR_NUMBER=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" -f title='Persist live 166-player news model decisions' -f head="$BRANCH" -f base='main' -f body="$BODY" --jq '.number');fi
          test -n "$PR_NUMBER"
          PR_STATE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.state');PR_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.ref');PR_BASE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.ref')
          if [ "$PR_STATE" != 'open' ] || [ "$PR_HEAD" != "$BRANCH" ] || [ "$PR_BASE" != 'main' ]; then echo "FAIL: persistence PR verification failed: number=${PR_NUMBER} state=${PR_STATE} head=${PR_HEAD} base=${PR_BASE}";exit 1;fi
          gh workflow run guardrail-qa.yml --ref "$BRANCH"
          PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
          echo 'changed=true' >> "$GITHUB_OUTPUT";echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT";echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Auto-merge scheduled generated update only after current required check
        if: steps.persist.outputs.changed == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.persist.outputs.pr_url }}
          PR_NUMBER: ${{ steps.persist.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          LAST_DISPATCH_SHA=''
          LAST_FAILURE_RETRY_SHA=''
          for i in $(seq 1 180); do
            PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            PR_STATE=$(printf '%s' "$PR_JSON" | jq -r '.state')
            if [ "$PR_STATE" != 'open' ]; then
              MERGED=$(printf '%s' "$PR_JSON" | jq -r '.merged')
              if [ "$MERGED" = 'true' ]; then echo "Live-news decision PR #${PR_NUMBER} is merged.";exit 0;fi
              echo "Live-news decision PR #${PR_NUMBER} is no longer open and was not merged.";exit 1
            fi
            MERGE_SHA=$(printf '%s' "$PR_JSON" | jq -r '.merge_commit_sha // empty')
            HEAD_REF=$(printf '%s' "$PR_JSON" | jq -r '.head.ref')
            if [ -n "$MERGE_SHA" ]; then
              CHECK=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/check-runs" --jq '[.check_runs[] | select(.name=="guardrail-qa" and .app.id==15368)] | sort_by(.started_at // .created_at) | last // {}')
              CONCLUSION=$(printf '%s' "$CHECK" | jq -r '.conclusion // empty');STATUS=$(printf '%s' "$CHECK" | jq -r '.status // empty')
              if [ "$CONCLUSION" = 'success' ]; then
                CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merge_commit_sha // empty')
                if [ "$CURRENT_SHA" != "$MERGE_SHA" ]; then echo "Protected merge moved from ${MERGE_SHA} to ${CURRENT_SHA}; revalidating.";continue;fi
                echo "Required guardrail-qa passed on current protected synthetic merge ${MERGE_SHA}."
                if gh pr merge "$PR_URL" --merge --delete-branch; then exit 0;fi
                echo 'Merge rejected after validated check; revalidating current synthetic merge.';sleep 10;continue
              elif [ "$STATUS" = 'completed' ] && [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != 'success' ]; then
                if [ "$MERGE_SHA" != "$LAST_FAILURE_RETRY_SHA" ]; then echo "Guardrail ${CONCLUSION} on ${MERGE_SHA}; redispatching once for exact current merge.";gh workflow run guardrail-qa.yml --ref "$HEAD_REF";LAST_FAILURE_RETRY_SHA="$MERGE_SHA";LAST_DISPATCH_SHA="$MERGE_SHA";sleep 10;continue;fi
                echo "Guardrail remained ${CONCLUSION} on ${MERGE_SHA} after one retry.";exit 1
              fi
              if [ "$MERGE_SHA" != "$LAST_DISPATCH_SHA" ]; then
                CHECK_COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/check-runs" --jq '[.check_runs[] | select(.name=="guardrail-qa" and .app.id==15368)] | length')
                if [ "$CHECK_COUNT" = '0' ]; then echo "No guardrail on current merge ${MERGE_SHA}; dispatching.";gh workflow run guardrail-qa.yml --ref "$HEAD_REF";LAST_DISPATCH_SHA="$MERGE_SHA";fi
              fi
            fi
            sleep 10
          done
          echo 'Required guardrail-qa did not reach a stable mergeable protected synthetic commit within 30 minutes.'
          exit 1
