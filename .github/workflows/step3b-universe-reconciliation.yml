name: Step 3B-2 Universe Reconciliation

on:
  pull_request:
    paths:
      - 'players*.json'
      - 'historicalStats2026.json'
      - 'projection-context-audit-2026.json'
      - 'projection-downstream-audit.json'
      - 'overall-rank-audit-decisions.json'
      - 'guardrails/guardrails-config.json'
      - 'guardrails/universe-change-manifest.json'
      - '.github/workflows/apply-overall-audit-and-cohesion.yml'
      - '.github/workflows/recalibrate-projections.yml'
      - '.github/workflows/propagate-projection-recalibration.yml'
      - '.github/workflows/final-162-qa-publish.yml'
      - 'scripts/build-step3b-162-shadow-recalculation.mjs'
      - 'scripts/audit-step3b-universe-reconciliation.mjs'
      - '.github/workflows/step3b-universe-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-universe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build read-only active-universe shadow recalculation
        run: node scripts/build-step3b-162-shadow-recalculation.mjs
      - name: Audit active-universe reconciliation
        run: node scripts/audit-step3b-universe-reconciliation.mjs
      - name: Run hard Guardrail QA
        run: node scripts/run-guardrail-qa.mjs
      - name: Upload reconciliation and shadow reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step3b-universe-reconciliation
          path: |
            guardrails/step3b-universe-reconciliation-audit.json
            guardrails/step3b-shadow-projection-context-*.json
            guardrails/step3b-shadow-projection-downstream-*.json
            guardrails/step3b-shadow-overall-review-queue-*.json
          if-no-files-found: error
