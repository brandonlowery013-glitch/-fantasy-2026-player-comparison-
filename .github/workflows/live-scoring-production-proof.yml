name: Live Scoring Production Proof

# Pull-request execution validates only the observer contract. Production proof is accepted only from an autonomous
# schedule or from the completion of the repository's already-proven scheduled Adaptive Pregame Market Refresh.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: ['Adaptive Pregame Market Refresh']
    types: [completed]
  pull_request:
    paths:
      - '.github/workflows/live-scoring-production-proof.yml'
      - 'scripts/verify-cloudflare-live-scoring-production.mjs'
      - 'runtime-live-game-center-2026.js'

permissions:
  contents: read

concurrency:
  group: live-scoring-production-proof
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate production observer syntax
        run: |
          node --check scripts/verify-cloudflare-live-scoring-production.mjs
          node --check runtime-live-game-center-2026.js

  live-window:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      has_live_game: ${{ steps.espn.outputs.has_live_game }}
    steps:
      - name: Record autonomous trigger provenance
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Production observer triggered by scheduled Adaptive Pregame Market Refresh run ${{ github.event.workflow_run.id }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Production observer triggered by its native schedule." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Detect an NFL game currently in progress
        id: espn
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const dates = [...new Set([-86400000, 0, 86400000].map(delta => new Date(Date.now() + delta).toISOString().slice(0,10).replaceAll('-','')))];
          (async () => {
            let live = [];
            for (const date of dates) {
              const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=${date}&limit=100&_=${Date.now()}`);
              if (!response.ok) throw new Error(`ESPN scoreboard ${response.status}`);
              const body = await response.json();
              live.push(...(body.events || []).filter(event => event?.status?.type?.state === 'in' && event?.status?.type?.completed !== true));
            }
            const ids = [...new Set(live.map(event => String(event.id)))];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_live_game=${ids.length ? 'true' : 'false'}\n`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, ids.length ? `NFL game(s) live: ${ids.join(', ')}\n` : 'No NFL game is live; no browser proof run is needed.\n');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

  production-proof:
    if: >-
      needs.live-window.outputs.has_live_game == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.head_branch == 'main'))
    needs: live-window
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CTD_PRODUCTION_URL: https://frontend-ctd-cloudflare-work.chuck-the-duke-preview.pages.dev/
      CTD_PROOF_DIR: artifacts/live-scoring-production-proof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Observe the deployed Cloudflare page during the real game
        run: node scripts/verify-cloudflare-live-scoring-production.mjs
      - name: Publish proof summary
        if: always()
        shell: bash
        run: |
          if [ -f "$CTD_PROOF_DIR/proof.json" ]; then
            node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("artifacts/live-scoring-production-proof/proof.json","utf8")); const lines=["## Live scoring production proof",`- Result: **${p.result}**`,`- Basic pass: **${Boolean(p.basic_pass)}**`,p.espn?`- Matchup: **${p.espn.away_team} @ ${p.espn.home_team}**`:null,p.cloudflare_game?`- Clock/state: **${p.cloudflare_game.clock} · ${p.cloudflare_game.status}**`:null,p.rendered_player?`- Mapped ESPN player rendered: **${p.rendered_player.player} (${p.rendered_player.team})**`:null,p.error?`- Error: ${String(p.error).split("\n")[0]}`:null].filter(Boolean).join("\n")+"\n"; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines);'
          fi
      - name: Upload production proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-scoring-production-proof-${{ github.run_id }}
          path: artifacts/live-scoring-production-proof/
          if-no-files-found: warn
          retention-days: 30
