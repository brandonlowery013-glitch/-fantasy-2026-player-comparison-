name: Step 3 Build Market Value Board
on:
  push:
    branches: [model/step3-market-discrepancy-value-board]
    paths:
      - 'scripts/build-market-value-board-2026.mjs'
      - '.trigger-step3-market-value'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model/step3-market-discrepancy-value-board
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Step 3 market value board
        run: node scripts/build-market-value-board-2026.mjs
      - name: Validate board
        run: |
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('data/market/market-value-board-2026.json','utf8'));
          if(x.status!=='STEP_3_MARKET_DISCREPANCY_VALUE_BOARD'||x.universe!==166||x.board.length!==166)throw Error('Step 3 contract failed');
          if(new Set(x.board.map(p=>p.player)).size!==166)throw Error('duplicate players');
          if(x.authority!=='COMPANION_ONLY_NO_INTRINSIC_RANK_MUTATION')throw Error('authority contract failed');
          if(x.price_pending.length!==10)throw Error('price-pending contract failed');
          if(x.board.some(p=>!['BUY','FAIR','REACH','FADE','PRICE PENDING'].includes(p.action)))throw Error('invalid top-level action');
          console.log({counts:x.counts,top_buys:x.top_buys.slice(0,10).map(p=>p.player),top_fades:x.top_fades.slice(0,10).map(p=>p.player),price_pending:x.price_pending});
          NODE
      - name: Commit generated board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/market-value-board-2026.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate Step 3 market value board [skip ci]"
          git push origin HEAD:model/step3-market-discrepancy-value-board
