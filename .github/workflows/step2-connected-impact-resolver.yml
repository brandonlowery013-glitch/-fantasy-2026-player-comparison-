name: Step 2 Connected Impact Resolver

on:
  workflow_dispatch:
  pull_request:
  workflow_run:
    workflows: ["Step 1 Automatic NFL Event Ingestion"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'workflow_run'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate resolver contract
        run: node scripts/validate-connected-impact-resolver.mjs
      - name: Self-test OUT and return propagation
        run: node scripts/build-connected-impact-resolver.mjs --self-test
      - name: Test guarded impact publication
        run: node scripts/test-guarded-impact-publication.mjs
      - name: Revalidate foundation contract
        run: node scripts/validate-model-foundation-contract.mjs

  resolve:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'workflow_run'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: write
    concurrency:
      group: production-main-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build connected-impact reassessment queue
        run: node scripts/build-connected-impact-resolver.mjs
      - name: Publish exact validated impact state through guarded PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-guarded-impact-state.sh connected
