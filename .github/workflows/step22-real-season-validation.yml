name: Step 22 Real-Season Validation

on:
  workflow_dispatch:
  pull_request:
  push:
  schedule:
    - cron: '50 */6 * * *'

jobs:
  step22-real-season-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Step 22 chronology and guardrails
        run: node scripts/validate-real-season-validation.mjs --self-test
      - name: Build current Step 22 live validation state
        run: node scripts/validate-real-season-validation.mjs
      - name: Verify current preseason state
        run: node -e "const x=require('./data/calibration/real-season-validation-status-2026.json');if(x.overall_status!=='WAITING_FOR_SOURCE'||x.actionable!==false||x.live_evidence.settled_forecasts!==0)process.exit(1)"
      - name: Revalidate weekly pipeline health
        run: node scripts/validate-weekly-pipeline-health-contract.mjs
      - name: Revalidate calibration governance
        run: node scripts/validate-calibration-governance-contract.mjs
      - name: Revalidate postgame settlement contract
        run: node scripts/validate-postgame-forecast-settlement-contract.mjs
      - name: Revalidate live market holdout calibration
        run: node scripts/validate-live-week-calibration-contract.mjs
      - name: Upload Step 22 validation state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step22-real-season-validation
          path: |
            data/sources/real-season-validation-2026.json
            data/calibration/real-season-validation-status-2026.json
          if-no-files-found: error
