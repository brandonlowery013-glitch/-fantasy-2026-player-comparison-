name: Advance Week After Finals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - lib/football-source-fetch.mjs
      - scripts/collect-automatic-football-context.mjs
      - .github/workflows/advance-week-after-finals.yml
  schedule:
    - cron: '25 * * * *'

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: write

concurrency:
  group: weekly-rollover
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate automatic repository updates
        id: automation-app
        if: github.event_name != 'pull_request'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: Iv23liKb5t5sPohFHK3m
          private-key: ${{ secrets.CTD_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.automation-app.outputs.token || github.token }}
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test football source recovery
        run: node scripts/test-football-source-fetch.mjs

      - name: Require every current-week game to be final
        id: gate
        run: node scripts/check-week-rollover-readiness.mjs

      - name: Stop cleanly while current week is still active
        if: steps.gate.outputs.ready != 'true'
        run: echo 'Current week still has an unfinished game; no rollover performed.'

      - name: Ingest next-week schedule
        if: steps.gate.outputs.ready == 'true'
        env:
          NFL_WEEK: ${{ steps.gate.outputs.next_week }}
        run: node scripts/ingest-weekly-football-data.mjs

      - name: Collect next-week football context
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/collect-automatic-football-context.mjs

      - name: Rebuild next-week source and context
        if: steps.gate.outputs.ready == 'true'
        env:
          NFL_WEEK: ${{ steps.gate.outputs.next_week }}
        run: node scripts/ingest-weekly-football-data.mjs

      - name: Normalize next-week football context
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/normalize-weekly-football-context.mjs

      - name: Build weekly projections
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/build-weekly-projection-generator.mjs

      - name: Build in-season ROS plus weekly ranking layer
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/build-in-season-ranking-layer.mjs

      - name: Synchronize current ROS and weekly exports
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/validate-canonical-consumers.mjs --write-exports

      - name: Build consistent next-week game and player views
        if: steps.gate.outputs.ready == 'true'
        run: |
          node scripts/build-weekly-probability-engine.mjs
          node scripts/build-player-detail-feed.mjs
          node scripts/validate-player-detail-feed.mjs
          node scripts/build-game-team-scoring-priors.mjs
          node scripts/refresh-current-game-scoring.mjs
          node scripts/build-weekly-game-projections.mjs

      - name: Capture next-week markets and rebuild recommendations
        if: steps.gate.outputs.ready == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MARKET_MAX_PROP_EVENTS: ${{ vars.MARKET_MAX_PROP_EVENTS }}
        run: |
          node scripts/ingest-live-market-snapshots.mjs
          node scripts/validate-weekly-matchup-market-snapshots.mjs
          node scripts/validate-player-prop-market-snapshots.mjs
          node scripts/build-game-market-recommendations.mjs
          node scripts/refresh-postgame-model-learning.mjs --capture
          node scripts/build-player-prop-recommendations.mjs
          node scripts/build-weekly-matchup-notes.mjs
          node scripts/build-unified-opportunity-engine.mjs
          node scripts/build-weekly-parlay-recommendations.mjs
          node scripts/build-final-betting-ui-feed.mjs
          node scripts/validate-final-betting-pipeline-step4.mjs

      - name: Run hard guardrail QA
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/run-guardrail-qa.mjs

      - name: Persist rollover through protected PR
        id: persist
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.automation-app.outputs.token }}
        shell: bash
        run: |
          FILES=(
            data/calibration/weekly-event-schedule-2026.json
            data/ingestion/team-personnel-2026.json data/ingestion/weekly-football-source-snapshots-2026.json
            data/probability/weekly-football-context-raw-2026.json
            data/probability/weekly-football-context-inputs-2026.json
            data/probability/weekly-projection-inputs-2026.json
            data/weekly/in-season-ranking-layer-2026.json
            data/weekly/player-detail-feed-2026.json
            lib/weekly-matchup-notes.mjs
            data/probability/generated/weekly-probability-distributions-2026.json
            data/probability/generated/game-team-scoring-priors-2023-2025.json
            data/probability/generated/current-game-scoring-2026.json
            data/probability/generated/weekly-game-projections-2026.json
            data/market/current-game-lines-2026.json
            data/market/weekly-matchup-market-snapshots-2026.json
            data/market/player-prop-market-snapshots-2026.json
            data/market/live-market-ingestion-status-2026.json
            data/market/weekly-game-market-recommendations-2026.json
            data/market/game-model-consumer-2026.json
            data/market/postgame-model-learning-2026.json
            data/market/player-prop-recommendations-2026.json
            data/market/unified-opportunities-2026.json
            data/market/parlay-recommendations-2026.json
            data/market/final-betting-ui-feed-2026.json
            data/market/issued-pick-history-2026.json
            exports/fantasy-2026-current.xlsx exports/fantasy-2026-current.docx
            guardrails/weekly-football-context-normalization-report.json
            guardrails/in-season-ranking-layer-report.json
            guardrails/week-rollover-readiness-report.json
            guardrails/automatic-football-context-adapters-report.json
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in "${FILES[@]}"; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="production/week-${{ steps.gate.outputs.next_week }}-rollover-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "Advance production context to Week ${{ steps.gate.outputs.next_week }}"
          git push origin "HEAD:$branch"
          pr_url=$(gh pr create --base main --head "$branch" --title "Production: advance to Week ${{ steps.gate.outputs.next_week }}" --body "Automatically generated after every Week ${{ steps.gate.outputs.current_week }} game was confirmed final. Refreshes next-week schedule, football context, projections, and matchup-sensitive in-season rankings. ADP remains disabled. Required guardrail-qa must pass before merge.")
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_url##*/}" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Merge generated rollover only after required checks
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.persist.outputs.pr_url }}
        shell: bash
        run: |
          bash scripts/merge-guarded-production-pr.sh "${{ steps.persist.outputs.pr_number }}" "${{ steps.persist.outputs.branch }}" merge

      - name: Refresh games and props after verified rollover
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run step24-weekly-production-orchestration.yml --ref main

      - name: Upload rollover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-rollover-readiness
          path: |
            guardrails/week-rollover-readiness-report.json
            guardrails/automatic-football-context-adapters-report.json
            guardrails/in-season-ranking-layer-report.json
          if-no-files-found: warn
