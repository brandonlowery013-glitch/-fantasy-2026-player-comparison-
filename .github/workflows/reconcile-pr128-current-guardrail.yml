name: Reconcile PR 128 Current Guardrail

on:
  push:
    branches:
      - model/add-kaleb-johnson-163

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[current-guardrail-reconciled]') && !contains(github.event.head_commit.message, 'Remove exact current-guardrail reconciliation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model/add-kaleb-johnson-163
          fetch-depth: 0
      - name: Fetch current main
        run: git fetch origin main:refs/remotes/origin/main
      - name: Rebuild exact guardrail state
        run: node scripts/reconcile-pr128-current-guardrail.mjs
      - name: Commit reconciled state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players*.json current162patch-2026-08-24.json lockedRanks2026.json
          if git diff --cached --quiet; then
            echo "No reconciliation changes required"
            exit 0
          fi
          git commit -m "[current-guardrail-reconciled] Align PR 128 with exact current guardrail"
          git push origin HEAD:model/add-kaleb-johnson-163
