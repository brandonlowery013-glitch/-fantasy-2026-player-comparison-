name: Transition Source Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/diagnose-transition-source-coverage.mjs'
      - 'scripts/run-transition-source-diagnostics.mjs'
      - 'scripts/build-transition-intelligence-review.mjs'
      - '.github/workflows/transition-source-diagnostics.yml'

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  diagnose-transition-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build current live ledger prerequisite
        run: |
          node scripts/build-live-full-universe-review-v2.mjs
          node scripts/normalize-nfl-article-bodies.mjs
          node scripts/filter-live-review-materiality.mjs
      - name: Diagnose native historical transition sources
        env:
          TRANSITION_LOOKBACK_START: '2026-04-01T00:00:00Z'
        run: node scripts/run-transition-source-diagnostics.mjs
      - name: Upload transition source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transition-source-diagnostics
          path: guardrails/transition-source-diagnostics.json
          if-no-files-found: error
