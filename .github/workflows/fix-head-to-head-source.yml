name: Fix Head-to-Head Source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run head-to-head source fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make equal-cost winner follow Overall Draft Board
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-backup.html')
          s=p.read_text()
          old='const eqs=p=>p.s;'
          new='const eqs=p=>-Number(p.o||9999);'
          if old not in s:
              raise SystemExit('eqs source not found')
          s=s.replace(old,new,1)
          s=s.replace('Better fantasy player based on our price-independent evaluation.','Better fantasy player at equal cost based on our Overall Draft Board.',1)
          p.write_text(s)
          # Bust the outer page cache so Safari pulls the corrected core app.
          q=Path('index.html')
          x=q.read_text()
          import re
          x=re.sub(r'index-backup\.html\?v=[^"\']+', 'index-backup.html?v=20260823-1515', x)
          q.write_text(x)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index-backup.html index.html
          git commit -m 'Align head-to-head winner with Overall Draft Board [skip ci]'
          git push
