name: Transition Intelligence Checkpoint 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transition-intelligence-checkpoint-2.yml'

permissions:
  contents: read
  actions: read

jobs:
  checkpoint-2-transition-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore immutable checkpoint 1 archive
        uses: actions/download-artifact@v4
        with:
          name: transition-intelligence-checkpoint-1-historical-archive
          path: checkpoint-1
          repository: brandonlowery013-glitch/-fantasy-2026-player-comparison-
          run-id: 34016144430
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote checkpoint 1 saved state into workspace
        run: |
          REVIEW_FILE="$(find checkpoint-1 -type f -name 'current-football-review.json' -print -quit)"
          PHASE_FILE="$(find checkpoint-1 -type f -name 'season-phase-transition-report.json' -print -quit)"
          test -n "$REVIEW_FILE"
          test -n "$PHASE_FILE"
          mkdir -p guardrails
          cp "$REVIEW_FILE" guardrails/current-football-review.json
          cp "$PHASE_FILE" guardrails/season-phase-transition-report.json
      - name: Validate restored checkpoint 1 state
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('MODEL_SOURCE_OF_TRUTH.json','utf8'));
          const ledger=JSON.parse(fs.readFileSync('guardrails/current-football-review.json','utf8'));
          const phase=JSON.parse(fs.readFileSync('guardrails/season-phase-transition-report.json','utf8'));
          const expected=Number(src.active_player_model);
          if((ledger.players||[]).length!==expected) throw new Error(`Checkpoint 1 restore coverage mismatch ${(ledger.players||[]).length}/${expected}`);
          if(ledger.source_quality?.official_team_sitemap_ingestion!==true) throw new Error('Checkpoint 1 official-team archive not restored');
          if(ledger.source_quality?.player_external_news_rss!==true) throw new Error('Checkpoint 1 player-news archive not restored');
          if(phase.result!=='PASS'||phase.football_state!=='REGULAR_SEASON_ACTIVE') throw new Error('Checkpoint 1 season authority invalid');
          console.log(JSON.stringify({result:'PASS',players:expected,checkpoint_1_run:34016144430},null,2));
          NODE
      - name: Filter current materiality without erasing historical archive
        run: node scripts/filter-live-review-materiality.mjs
      - name: Build enrich and integrate transition intelligence
        env:
          TRANSITION_LOOKBACK_START: '2026-04-01T00:00:00Z'
        run: |
          node scripts/build-transition-intelligence-review.mjs
          node scripts/enrich-transition-from-unified-evidence.mjs
          node scripts/run-position-specific-transition-integration.mjs
      - name: Validate checkpoint 2 transition state
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('MODEL_SOURCE_OF_TRUTH.json','utf8'));
          const report=JSON.parse(fs.readFileSync('analysis/transition-intelligence-current.json','utf8'));
          const integration=JSON.parse(fs.readFileSync('guardrails/transition-intelligence-integration-report.json','utf8'));
          const camp=JSON.parse(fs.readFileSync('guardrails/retroactive-camp-backfill-report.json','utf8'));
          const phase=JSON.parse(fs.readFileSync('guardrails/season-phase-transition-report.json','utf8'));
          const expected=Number(src.active_player_model);
          if((report.rows||[]).length!==expected||Number(camp.counts?.players)!==expected) throw new Error('Checkpoint 2 full-universe coverage missing');
          if(phase.result!=='PASS'||phase.football_state!=='REGULAR_SEASON_ACTIVE'||phase.fantasy_draft_state_gate!==false) throw new Error('Regular-season authority contract invalid');
          if(integration.result!=='PASS') throw new Error('Transition integration failed');
          if(report.chronological_context?.mandatory!==true) throw new Error('Chronological context missing');
          const pc=camp.position_counts||{};
          const resolved=['RB','QB','WR','TE'].reduce((n,k)=>n+Number(pc[k]?.players||0),0);
          if(resolved!==expected||Number(pc.OTHER?.players||0)!==0) throw new Error(`Position-specific audit missing: ${resolved}/${expected}`);
          console.log(JSON.stringify({result:'PASS',players:expected,checkpoint_1_run:34016144430,camp_evidence_players:integration.retroactive_camp_evidence_players,camp_evidence_added:integration.retroactive_camp_evidence_added,timeline_players:integration.players_with_chronological_timeline,current_state_players:integration.players_with_current_state_basis},null,2));
          NODE
      - name: Upload checkpoint 2 saved transition state
        uses: actions/upload-artifact@v4
        with:
          name: transition-intelligence-checkpoint-2-transition-state
          path: |
            analysis/transition-intelligence-current.json
            analysis/transition-intelligence-current.md
            analysis/rookie-development-review-current.json
            guardrails/current-football-review.json
            guardrails/retroactive-camp-backfill-report.json
            guardrails/transition-intelligence-integration-report.json
            guardrails/season-phase-transition-report.json
          if-no-files-found: error
          retention-days: 30
