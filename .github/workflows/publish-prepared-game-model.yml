name: Publish prepared game model
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-prepared-game-model.yml'
      - 'scripts/publish-prepared-game-model.mjs'
      - 'scripts/prepared-model-publisher-loop.mjs'
      - 'scripts/publish-prepared-model-cycle.sh'
      - 'data/market/game-model-consumer-2026.json'
      - 'data/market/final-betting-ui-feed-2026.json'
      - 'data/market/unified-opportunities-2026.json'
      - 'data/market/football-moneyline-learning-2026.json'
      - 'data/probability/generated/weekly-game-projections-2026.json'
  workflow_run:
    workflows: ['Adaptive Pregame Market Refresh', 'Issued Pick Settlement', 'Final Betting Pipeline Step 4', 'Step 24 Weekly Production Orchestration', 'Adaptive Player Prop Refresh', 'CTD Preview Season History', 'Automatic NFL Football Ingestion', 'Weekly Fantasy Player Learning']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: ${{ (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) && 'prepared-game-model' || format('prepared-model-ignored-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: producer
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/publish-prepared-game-model.mjs
            /scripts/prepared-model-publisher-loop.mjs
            /scripts/publish-prepared-model-cycle.sh
            /scripts/test-prepared-model-publisher-loop.mjs
      - uses: actions/checkout@v4
        with:
          ref: frontend/ctd-cloudflare-work
          path: engine
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /workers/betting-splits/lib/
            /workers/betting-splits/model/
      - uses: actions/checkout@v4
        with:
          ref: data/prepared-game-model
          path: publication
          sparse-checkout-cone-mode: false
          sparse-checkout: /data/market/prepared-game-model-2026*
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the bounded background publisher
        run: node producer/scripts/test-prepared-model-publisher-loop.mjs
      - name: Maintain five-minute model publication through schedule delays
        run: node producer/scripts/prepared-model-publisher-loop.mjs
