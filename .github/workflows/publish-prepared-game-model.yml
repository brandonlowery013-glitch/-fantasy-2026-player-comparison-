name: Publish prepared game model
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-prepared-game-model.yml'
      - 'scripts/publish-prepared-game-model.mjs'
      - 'data/market/game-model-consumer-2026.json'
      - 'data/market/final-betting-ui-feed-2026.json'
      - 'data/market/unified-opportunities-2026.json'
      - 'data/market/football-moneyline-learning-2026.json'
      - 'data/probability/generated/weekly-game-projections-2026.json'
  workflow_run:
    workflows: ['Adaptive Pregame Market Refresh', 'Issued Pick Settlement', 'Final Betting Pipeline Step 4', 'Step 24 Weekly Production Orchestration', 'Adaptive Player Prop Refresh', 'CTD Preview Season History', 'Automatic NFL Football Ingestion', 'Weekly Fantasy Player Learning']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: prepared-game-model
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: producer
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/publish-prepared-game-model.mjs
      - uses: actions/checkout@v4
        with:
          ref: frontend/ctd-cloudflare-work
          path: engine
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /workers/betting-splits/lib/
            /workers/betting-splits/model/
      - uses: actions/checkout@v4
        with:
          ref: data/prepared-game-model
          path: publication
          sparse-checkout-cone-mode: false
          sparse-checkout: /data/market/prepared-game-model-2026*
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculate with the deployed model engine
        run: |
          cp producer/scripts/publish-prepared-game-model.mjs engine/publish-model.mjs
          export CTD_ENGINE_REF=$(git -C engine rev-parse HEAD)
          node engine/publish-model.mjs "$GITHUB_WORKSPACE/prepared.json"
      - name: Publish without overwriting concurrent changes
        working-directory: publication
        run: |
          git config user.name 'CTD Model Publisher'
          git config user.email 'ctd-model-publisher@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin data/prepared-game-model
            git reset --hard origin/data/prepared-game-model
            mkdir -p data/market
            cp "$GITHUB_WORKSPACE/prepared.json.gz" data/market/prepared-game-model-2026.json.gz
            cp "$GITHUB_WORKSPACE/prepared.json.manifest.json" data/market/prepared-game-model-2026.manifest.json
            cp "$GITHUB_WORKSPACE/prepared.json.moneyline.json" data/market/prepared-game-model-2026.moneyline.json
            for kind in model betting model-envelope betting-envelope; do
              cp "$GITHUB_WORKSPACE/prepared.json.$kind.json.gz" "data/market/prepared-game-model-2026.$kind.json.gz"
            done
            git add data/market/prepared-game-model-2026*
            git diff --cached --quiet && exit 0
            git commit -m 'Publish prepared game model [skip ci]'
            git push origin HEAD:data/prepared-game-model && exit 0
          done
          exit 1
