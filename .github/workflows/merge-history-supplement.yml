name: Merge missing veteran history
on:
  push:
    paths:
      - 'historicalStatsSupplement2026.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Merge supplement into historical stats
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base_path=Path('historicalStats2026.json')
          sup_path=Path('historicalStatsSupplement2026.json')
          base=json.loads(base_path.read_text())
          sup=json.loads(sup_path.read_text())
          base.setdefault('players', {}).update(sup.get('players', {}))
          base['as_of']='2026-08-23'
          base['source']='NFL.com career statistics + existing Master Player Evaluations career statistics'
          base_path.write_text(json.dumps(base,separators=(',',':')))
          PY
      - name: Commit merged history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historicalStats2026.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fill missing veteran historical stats'
          git push
