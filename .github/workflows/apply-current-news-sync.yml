name: Apply Current News Sync
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    if: github.event.head_commit.message == 'Run current news sync now'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require complete full-universe football review
        run: node scripts/validate-full-universe-news-review.mjs
      - name: Verify canonical active universe
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=require('./MODEL_SOURCE_OF_TRUTH.json');
          const expected=Number(s.active_player_model);
          const shards=Number(s.runtime_player_shards);
          let names=[];
          for(let i=0;i<shards;i++) names.push(...require(`./players${i}.json`).map(p=>p.n));
          const unique=new Set(names);
          if(names.length!==expected) throw new Error(`canonical player count mismatch: expected ${expected}, loaded ${names.length}`);
          if(unique.size!==expected) throw new Error(`canonical unique player count mismatch: expected ${expected}, found ${unique.size}`);
          console.log(JSON.stringify({players:expected,shards,status:'PASS'}));
          NODE
      - name: Verify current canonical runtime wiring
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const runtime=fs.readFileSync('runtime-interface-data-sync-2026.js','utf8');
          for(const x of ['runtime-interface-data-sync-2026.js','runtime-final-interface-2026.js']) if(!html.includes(x)) throw new Error(`index missing ${x}`);
          for(const x of ['matchup-tidbits-2026.json','interface-impact-payload-2026.json']) if(!runtime.includes(x)) throw new Error(`runtime missing ${x}`);
          console.log(JSON.stringify({runtime:'canonical',status:'PASS'}));
          NODE
      - name: Run hard Guardrail QA
        run: node scripts/run-guardrail-qa.mjs
