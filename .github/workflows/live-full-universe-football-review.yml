name: Live Full Universe Football Review

on:
  workflow_dispatch:
  schedule:
    - cron: '35 */4 * * *'
  pull_request:
    paths:
      - 'scripts/build-live-full-universe-review.mjs'
      - 'scripts/build-live-full-universe-review-v2.mjs'
      - 'scripts/normalize-nfl-article-bodies.mjs'
      - 'scripts/collect-official-team-news.mjs'
      - 'scripts/seed-current-team-overrides.mjs'
      - 'scripts/filter-live-review-materiality.mjs'
      - 'scripts/validate-full-universe-news-review.mjs'
      - 'scripts/collect-substantive-football-context.mjs'
      - 'scripts/build-substantive-football-context-inputs.mjs'
      - 'scripts/build-substantive-component-recalculation.mjs'
      - 'scripts/build-substantive-rank-proposals.mjs'
      - 'scripts/test-substantive-football-context-parser.mjs'
      - '.github/workflows/live-full-universe-football-review.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build-live-full-universe-review.mjs'
      - 'scripts/build-live-full-universe-review-v2.mjs'
      - 'scripts/normalize-nfl-article-bodies.mjs'
      - 'scripts/collect-official-team-news.mjs'
      - 'scripts/seed-current-team-overrides.mjs'
      - 'scripts/filter-live-review-materiality.mjs'
      - 'scripts/validate-full-universe-news-review.mjs'
      - 'scripts/collect-substantive-football-context.mjs'
      - 'scripts/build-substantive-football-context-inputs.mjs'
      - 'scripts/build-substantive-component-recalculation.mjs'
      - 'scripts/build-substantive-rank-proposals.mjs'
      - 'scripts/test-substantive-football-context-parser.mjs'
      - '.github/workflows/live-full-universe-football-review.yml'

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  live-166-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build live 166-player football review ledger
        run: |
          node scripts/build-live-full-universe-review-v2.mjs
          node scripts/normalize-nfl-article-bodies.mjs
          node scripts/seed-current-team-overrides.mjs
          node - <<'NODE'
          const fs=require('fs');
          const p='scripts/collect-official-team-news.mjs';
          let s=fs.readFileSync(p,'utf8');
          if(!s.includes('slice(0,20)')) throw new Error('Expected official-team article limit not found');
          s=s.replace('slice(0,20)','slice(0,40)');
          fs.writeFileSync(p,s);
          console.log('Live official-team crawl depth: 40 links/team');
          NODE
          node scripts/collect-official-team-news.mjs
          node scripts/filter-live-review-materiality.mjs
      - name: Validate complete active universe plus connected triage
        run: node scripts/validate-full-universe-news-review.mjs
      - name: Test substantive parser and outcome gates
        run: |
          node scripts/test-substantive-football-context-parser.mjs
          node scripts/build-substantive-component-recalculation.mjs --self-test
      - name: Build season-long substantive football context
        run: |
          node scripts/collect-substantive-football-context.mjs
          node scripts/build-substantive-football-context-inputs.mjs
      - name: Enforce substantive evidence coverage
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('MODEL_SOURCE_OF_TRUTH.json','utf8'));
          const review=JSON.parse(fs.readFileSync('guardrails/current-football-review.json','utf8'));
          const summary=JSON.parse(fs.readFileSync('guardrails/live-full-universe-review-summary.json','utf8'));
          const collect=JSON.parse(fs.readFileSync('guardrails/substantive-football-context-collection-report.json','utf8'));
          const ctx=JSON.parse(fs.readFileSync('guardrails/substantive-football-context-inputs-report.json','utf8'));
          if(review.source_method!=='NFL_COM_PRIMARY_PLUS_ESPN_PLAYER_LEVEL_FULL_UNIVERSE') throw new Error(`Wrong discovery method: ${review.source_method}`);
          if(review.source_quality?.official_team_site_ingestion!==true) throw new Error('Official team-site ingestion did not run');
          if(Number(review.source_quality?.official_team_sites_configured)!==32) throw new Error(`Official team-site registry incomplete: ${review.source_quality?.official_team_sites_configured}`);
          if(Number(review.source_quality?.official_team_indexes_fetched)!==32) throw new Error(`Official team-site fetch incomplete: ${review.source_quality?.official_team_indexes_fetched}/32`);
          if(review.materiality_filter?.method!=='FULL_NAME_OR_ATHLETE_BOUND_CONTEXT_PLUS_14_DAY_FRESHNESS_AND_NFL_FANOUT_GUARD') throw new Error(`Missing hardened full-name/athlete-bound materiality filter: ${JSON.stringify(review.materiality_filter)}`);
          if(review.materiality_filter?.name_collision_regression_tests!==true||review.source_quality?.name_collision_regression_tests!==true) throw new Error('Name-collision regression guard did not run');
          if(Number(review.source_quality?.espn_player_news_calls)<150) throw new Error(`ESPN player-news coverage too low: ${review.source_quality?.espn_player_news_calls}`);
          if(Number(review.source_quality?.espn_modeled_athlete_ids_resolved)<150) throw new Error(`Modeled ESPN athlete-ID coverage too low: ${review.source_quality?.espn_modeled_athlete_ids_resolved}/${src.active_player_model}`);
          if(Number(review.source_quality?.nfl_com_articles_fetched)<10) throw new Error(`NFL.com article coverage too low: ${review.source_quality?.nfl_com_articles_fetched}`);
          if(Number(review.source_quality?.nfl_unique_article_urls)<10) throw new Error(`NFL.com normalization coverage too low: ${review.source_quality?.nfl_unique_article_urls}`);
          if(Number(summary.tracked_material_news_signal_count)>Math.ceil(Number(src.active_player_model)*0.50)) throw new Error(`Material signal cardinality implausibly broad: ${summary.tracked_material_news_signal_count}/${src.active_player_model}`);
          if(collect.result!=='PASS') throw new Error('Substantive collector did not PASS');
          if(ctx.result!=='PASS') throw new Error('Structured substantive context did not PASS');
          console.log(JSON.stringify({official_team_sites:review.source_quality.official_team_sites_configured,official_team_articles:review.source_quality.official_team_articles_fetched,official_team_mentions:review.source_quality.official_team_full_name_mentions,material_players:summary.tracked_material_news_signal_count},null,2));
          NODE
      - name: Build evidence-gated substantive proposals
        run: |
          node scripts/build-substantive-component-recalculation.mjs
          node scripts/build-substantive-rank-proposals.mjs
      - name: Prove daily audit did not mutate canonical model files
        run: |
          if ! git diff --quiet -- players*.json MODEL_SOURCE_OF_TRUTH.json canonicalBoards2026.json; then
            echo 'Daily audit illegally mutated canonical model files.'
            git diff -- players*.json MODEL_SOURCE_OF_TRUTH.json canonicalBoards2026.json
            exit 1
          fi
      - name: Upload live and substantive audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-full-universe-substantive-review
          path: |
            guardrails/current-football-review.json
            guardrails/live-full-universe-review-summary.json
            guardrails/full-universe-news-review-report.json
            guardrails/substantive-football-context-collection-report.json
            guardrails/substantive-football-context-inputs-report.json
            data/probability/substantive-football-context-inputs-2026.json
            analysis/substantive-component-recalculation-current.json
            analysis/substantive-component-recalculation-current.md
            analysis/substantive-rank-proposals-current.json
            analysis/substantive-rank-proposals-current.md
          if-no-files-found: error
      - name: Persist latest validated evidence to rolling branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        shell: bash
        run: |
          EVIDENCE_FILES=(guardrails/current-football-review.json guardrails/live-full-universe-review-summary.json guardrails/full-universe-news-review-report.json guardrails/substantive-football-context-collection-report.json guardrails/substantive-football-context-inputs-report.json data/probability/substantive-football-context-inputs-2026.json analysis/substantive-component-recalculation-current.json analysis/substantive-component-recalculation-current.md analysis/substantive-rank-proposals-current.json analysis/substantive-rank-proposals-current.md)
          for f in "${EVIDENCE_FILES[@]}"; do test -f "$f"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="production/live-full-universe-review-latest"
          git switch -C "$BRANCH"
          git add -- "${EVIDENCE_FILES[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist latest daily 166-player substantive review"
          git push --force origin "HEAD:refs/heads/$BRANCH"
