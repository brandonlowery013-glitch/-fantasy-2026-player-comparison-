name: Live Full Universe Football Review

on:
  workflow_dispatch:
  schedule:
    - cron: '35 */4 * * *'
  pull_request:
    paths:
      - 'scripts/build-live-full-universe-review.mjs'
      - 'scripts/build-live-full-universe-review-v2.mjs'
      - 'scripts/normalize-nfl-article-bodies.mjs'
      - 'scripts/filter-live-review-materiality.mjs'
      - 'scripts/build-transition-intelligence-review.mjs'
      - 'scripts/enrich-transition-from-unified-evidence.mjs'
      - 'scripts/build-rookie-development-review.mjs'
      - 'scripts/enforce-offensive-transition-clusters.mjs'
      - 'scripts/build-chronological-transition-context.mjs'
      - 'scripts/integrate-transition-intelligence.mjs'
      - 'scripts/triage-untracked-candidates.mjs'
      - 'scripts/stage-admission-requests.mjs'
      - 'scripts/validate-full-universe-news-review.mjs'
      - 'admissions/queue.json'
      - 'scripts/collect-substantive-football-context.mjs'
      - 'scripts/build-substantive-football-context-inputs.mjs'
      - 'scripts/build-substantive-component-recalculation-v2.mjs'
      - 'scripts/build-full-universe-reconciliation-taxonomy.mjs'
      - 'scripts/build-substantive-rank-proposals.mjs'
      - 'scripts/test-substantive-football-context-parser.mjs'
      - '.github/workflows/live-full-universe-football-review.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build-live-full-universe-review.mjs'
      - 'scripts/build-live-full-universe-review-v2.mjs'
      - 'scripts/normalize-nfl-article-bodies.mjs'
      - 'scripts/filter-live-review-materiality.mjs'
      - 'scripts/build-transition-intelligence-review.mjs'
      - 'scripts/enrich-transition-from-unified-evidence.mjs'
      - 'scripts/build-rookie-development-review.mjs'
      - 'scripts/enforce-offensive-transition-clusters.mjs'
      - 'scripts/build-chronological-transition-context.mjs'
      - 'scripts/integrate-transition-intelligence.mjs'
      - 'scripts/triage-untracked-candidates.mjs'
      - 'scripts/stage-admission-requests.mjs'
      - 'scripts/validate-full-universe-news-review.mjs'
      - 'admissions/queue.json'
      - 'scripts/collect-substantive-football-context.mjs'
      - 'scripts/build-substantive-football-context-inputs.mjs'
      - 'scripts/build-substantive-component-recalculation-v2.mjs'
      - 'scripts/build-full-universe-reconciliation-taxonomy.mjs'
      - 'scripts/build-substantive-rank-proposals.mjs'
      - 'scripts/test-substantive-football-context-parser.mjs'
      - '.github/workflows/live-full-universe-football-review.yml'

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  live-universe-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build live canonical-universe football review ledger
        run: |
          node scripts/build-live-full-universe-review-v2.mjs
          node scripts/normalize-nfl-article-bodies.mjs
          node scripts/filter-live-review-materiality.mjs

      - name: Build and integrate full-universe transition intelligence
        env:
          TRANSITION_LOOKBACK_START: '2026-04-01T00:00:00Z'
        run: |
          node scripts/build-transition-intelligence-review.mjs
          node scripts/enrich-transition-from-unified-evidence.mjs
          node scripts/integrate-transition-intelligence.mjs
          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('MODEL_SOURCE_OF_TRUTH.json','utf8'));
          const review=JSON.parse(fs.readFileSync('guardrails/current-football-review.json','utf8'));
          const report=JSON.parse(fs.readFileSync('guardrails/transition-intelligence-integration-report.json','utf8'));
          const rookie=JSON.parse(fs.readFileSync('analysis/rookie-development-review-current.json','utf8'));
          if(report.result!=='PASS'||report.coverage!==Number(src.active_player_model)) throw new Error('Transition integration did not cover canonical universe');
          if(Number(rookie.counts?.players_checked)!==Number(src.active_player_model)) throw new Error('Rookie classification did not cover canonical universe');
          if((rookie.rookies||[]).some(x=>x.development_review?.required!==true)) throw new Error('Mandatory rookie development review missing');
          if(review.transition_intelligence_schema?.integrated_into_unified_evidence_stack!==true) throw new Error('Transition intelligence is still detached from unified evidence stack');
          for(const p of review.players||[]) if(p.transition_intelligence?.integrated_into_unified_evidence_stack!==true) throw new Error(`Detached transition review: ${p.player}`);
          console.log(JSON.stringify(report,null,2));
          NODE

      - name: Triage connected untracked candidates
        run: node scripts/triage-untracked-candidates.mjs

      - name: Stage ADMIT decisions into canonical admission requests
        run: node scripts/stage-admission-requests.mjs

      - name: Validate complete active universe plus connected triage
        run: node scripts/validate-full-universe-news-review.mjs

      - name: Test incremental substantive scoring
        run: |
          node scripts/test-substantive-football-context-parser.mjs
          node scripts/build-substantive-component-recalculation-v2.mjs --self-test

      - name: Build season-long substantive football context
        run: |
          node scripts/collect-substantive-football-context.mjs
          node scripts/build-substantive-football-context-inputs.mjs

      - name: Enforce substantive evidence coverage
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('MODEL_SOURCE_OF_TRUTH.json','utf8'));
          const review=JSON.parse(fs.readFileSync('guardrails/current-football-review.json','utf8'));
          const summary=JSON.parse(fs.readFileSync('guardrails/live-full-universe-review-summary.json','utf8'));
          const collect=JSON.parse(fs.readFileSync('guardrails/substantive-football-context-collection-report.json','utf8'));
          const ctx=JSON.parse(fs.readFileSync('guardrails/substantive-football-context-inputs-report.json','utf8'));
          const transition=JSON.parse(fs.readFileSync('guardrails/transition-intelligence-integration-report.json','utf8'));
          if((review.players||[]).length!==Number(src.active_player_model)) throw new Error(`Review coverage ${(review.players||[]).length}/${src.active_player_model}`);
          if(review.materiality_filter?.name_collision_regression_tests!==true||review.source_quality?.name_collision_regression_tests!==true) throw new Error('Name-collision regression guard did not run');
          if(Number(review.source_quality?.espn_player_news_calls)<Math.min(150,Number(src.active_player_model))) throw new Error(`ESPN player-news coverage too low: ${review.source_quality?.espn_player_news_calls}`);
          if(Number(review.source_quality?.espn_modeled_athlete_ids_resolved)<Math.min(150,Number(src.active_player_model))) throw new Error(`Modeled ESPN athlete-ID coverage too low: ${review.source_quality?.espn_modeled_athlete_ids_resolved}/${src.active_player_model}`);
          if(Number(summary.tracked_material_news_signal_count)>Math.ceil(Number(src.active_player_model)*0.50)) throw new Error(`Material signal cardinality implausibly broad: ${summary.tracked_material_news_signal_count}/${src.active_player_model}`);
          if(collect.result!=='PASS'||ctx.result!=='PASS'||transition.result!=='PASS') throw new Error('Unified substantive context pipeline did not PASS');
          console.log(JSON.stringify({players:src.active_player_model,breaking_news_material_players:summary.tracked_material_news_signal_count,transition_direct_players:transition.players_with_direct_transition_signals,transition_team_context_players:transition.players_with_team_context_signals,transition_teams:transition.offensive_transition_teams,transition_cluster_players:transition.offensive_transition_cluster_players,transition_timeline_players:transition.players_with_chronological_timeline,rookies:transition.rookie_players,rookies_with_evidence:transition.rookies_with_dated_development_evidence,rookie_unresolved:transition.rookie_classification_unresolved,structured_players:ctx.players,structured_signals:ctx.signals},null,2));
          NODE

      - name: Build incremental evidence proposals and canonical-universe taxonomy
        run: |
          node scripts/build-substantive-component-recalculation-v2.mjs
          node scripts/build-substantive-rank-proposals.mjs
          node scripts/build-full-universe-reconciliation-taxonomy.mjs

      - name: Validate taxonomy and silent-evidence guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('MODEL_SOURCE_OF_TRUTH.json','utf8'));
          const t=JSON.parse(fs.readFileSync('analysis/full-universe-reconciliation-taxonomy-current.json','utf8'));
          const rows=t.rows||[];
          if(rows.length!==Number(src.active_player_model)) throw new Error(`Taxonomy coverage ${rows.length}/${src.active_player_model}`);
          if(new Set(rows.map(x=>x.player)).size!==Number(src.active_player_model)) throw new Error('Taxonomy duplicate/missing players');
          const silent=rows.filter(x=>x.meaningful_evidence&&x.taxonomy==='NO_MATERIAL_UPDATE');
          if(silent.length) throw new Error(`Silent meaningful evidence: ${silent.map(x=>x.player).join(', ')}`);
          const allowed=new Set(['UP','DOWN','MATERIAL_HOLD','POSITIVE_HOLD','NEGATIVE_HOLD','NO_MATERIAL_UPDATE']);
          if(rows.some(x=>!allowed.has(x.taxonomy))) throw new Error('Invalid taxonomy value');
          console.log(JSON.stringify({result:'PASS',coverage:rows.length,counts:t.counts},null,2));
          NODE

      - name: Prove audit did not mutate canonical model files
        run: |
          if ! git diff --quiet -- players*.json MODEL_SOURCE_OF_TRUTH.json canonicalBoards2026.json; then
            echo 'Live audit illegally mutated canonical model files.'
            git diff -- players*.json MODEL_SOURCE_OF_TRUTH.json canonicalBoards2026.json
            exit 1
          fi

      - name: Upload live and reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-daily-full-universe-reconciliation
          path: |
            guardrails/current-football-review.json
            guardrails/live-full-universe-review-summary.json
            guardrails/full-universe-news-review-report.json
            guardrails/untracked-candidate-triage-report.json
            guardrails/substantive-football-context-collection-report.json
            guardrails/substantive-football-context-inputs-report.json
            guardrails/transition-intelligence-integration-report.json
            admissions/queue.json
            data/probability/substantive-football-context-inputs-2026.json
            analysis/transition-intelligence-current.json
            analysis/transition-intelligence-current.md
            analysis/rookie-development-review-current.json
            analysis/substantive-component-recalculation-current.json
            analysis/substantive-component-recalculation-current.md
            analysis/substantive-rank-proposals-current.json
            analysis/substantive-rank-proposals-current.md
            analysis/full-universe-reconciliation-taxonomy-current.json
            analysis/full-universe-reconciliation-taxonomy-current.md
          if-no-files-found: error

      - name: Persist latest validated evidence to rolling branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        shell: bash
        run: |
          EVIDENCE_FILES=(
            guardrails/current-football-review.json
            guardrails/live-full-universe-review-summary.json
            guardrails/full-universe-news-review-report.json
            guardrails/untracked-candidate-triage-report.json
            guardrails/substantive-football-context-collection-report.json
            guardrails/substantive-football-context-inputs-report.json
            guardrails/transition-intelligence-integration-report.json
            data/probability/substantive-football-context-inputs-2026.json
            analysis/transition-intelligence-current.json
            analysis/transition-intelligence-current.md
            analysis/rookie-development-review-current.json
            analysis/substantive-component-recalculation-current.json
            analysis/substantive-component-recalculation-current.md
            analysis/substantive-rank-proposals-current.json
            analysis/substantive-rank-proposals-current.md
            analysis/full-universe-reconciliation-taxonomy-current.json
            analysis/full-universe-reconciliation-taxonomy-current.md
          )
          for f in "${EVIDENCE_FILES[@]}"; do test -f "$f"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="production/live-full-universe-review-latest"
          git switch -C "$BRANCH"
          git add -- "${EVIDENCE_FILES[@]}"
          if git diff --cached --quiet; then exit 0; fi
          COUNT=$(node -p "require('./MODEL_SOURCE_OF_TRUTH.json').active_player_model")
          git commit -m "Persist latest six-daily ${COUNT}-player reconciliation"
          git push --force origin "HEAD:refs/heads/$BRANCH"
