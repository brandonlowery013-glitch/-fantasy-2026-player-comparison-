name: Live Full Universe Football Review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build-live-full-universe-review.mjs'
      - 'scripts/validate-full-universe-news-review.mjs'
      - '.github/workflows/live-full-universe-football-review.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build-live-full-universe-review.mjs'
      - '.github/workflows/live-full-universe-football-review.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  live-166-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build live 166-player football review ledger
        run: node scripts/build-live-full-universe-review.mjs
      - name: Validate complete active universe plus connected triage
        run: node scripts/validate-full-universe-news-review.mjs
      - name: Upload live review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-full-universe-football-review
          path: |
            guardrails/current-football-review.json
            guardrails/live-full-universe-review-summary.json
            guardrails/full-universe-news-review-report.json
          if-no-files-found: error
      - name: Persist validated review through protected PR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BRANCH="production/live-full-universe-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add guardrails/current-football-review.json guardrails/live-full-universe-review-summary.json guardrails/full-universe-news-review-report.json
          git commit -m "Persist live 166-player football review"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Persist live 166-player football review" --body "Live regular-season full-universe review generated from current ESPN team roster, depth-chart and injury endpoints. Includes exactly all canonical tracked players plus connected untracked top-depth-chart triage, and must pass the full-universe review validator and required Guardrail QA before merge. Source run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
