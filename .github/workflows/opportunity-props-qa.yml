name: Opportunity Prop Model QA
on:
  pull_request:
  push:
    branches: [main, frontend/ctd-cloudflare-work]
    paths:
      - 'lib/opportunity-*.mjs'
      - 'scripts/*opportunity-prop*.mjs'
      - 'scripts/lib/distribution-tail-math.mjs'
      - 'frontend/cloudflare/lib/*opportunity*.mjs'
      - '.github/workflows/opportunity-props-qa.yml'
permissions:
  contents: read
jobs:
  opportunity-props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-opportunity-props.mjs
      - run: node scripts/test-opportunity-prop-selection.mjs
      - run: node scripts/build-player-prop-recommendations.mjs --self-test
