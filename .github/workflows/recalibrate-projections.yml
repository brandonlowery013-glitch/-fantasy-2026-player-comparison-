name: Recalibrate 2026 projections with historical context
on:
  push:
    paths:
      - '.github/workflows/recalibrate-projections.yml'
      - '.trigger-projection-rerun'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recalibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recalibrate all player projections and audit historical integrity
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=fs.readdirSync('.').filter(f=>/^players\d+\.json$/.test(f)).sort((a,b)=>Number(a.match(/\d+/)[0])-Number(b.match(/\d+/)[0]));
          const histDoc=JSON.parse(fs.readFileSync('historicalStats2026.json','utf8'));
          const hist=histDoc.players||{};
          const num=v=>{if(v==null)return 0;const n=Number(String(v).replace(/,/g,'').replace(/[^0-9.-]/g,''));return Number.isFinite(n)?n:0};
          const has=(r,ks)=>ks.some(k=>r[k]!=null&&String(r[k]).trim()!==''&&String(r[k]).trim()!=='—');
          const get=(r,ks)=>{for(const k of ks)if(r[k]!=null)return num(r[k]);return 0};
          const gp=r=>get(r,['Games','GP','G'])||17;
          function ppr(row,pos){
            if(pos==='QB'){
              const py=get(row,['Pass Yards','PassYds']); const ptd=get(row,['Pass TD','PassTD']); const ints=get(row,['INT']); const ry=get(row,['Rush Yards','Rush Yds','RushYds']); const rtd=get(row,['Rush TD','RushTD']);
              return py*.04+ptd*4-ints*2+ry*.1+rtd*6;
            }
            const rec=get(row,['Receptions','Rec','Rec.']); const recY=get(row,['Receiving Yards','Rec Yds','RecYds','Rec. Yards']); const recTD=get(row,['TD','Rec TD','RecTD','Rec. TD']);
            const rushY=get(row,['Rush Yards','Rush Yds','RushYds']); const rushTD=get(row,['Rush TD','RushTD']);
            return rec+recY*.1+recTD*6+rushY*.1+rushTD*6;
          }
          function histBaseline(p){
            const rows=(hist[p.n]||[]).slice(-3); if(!rows.length)return null;
            const weights=rows.length===1?[1]:rows.length===2?[.35,.65]:[.2,.3,.5];
            let ppg=0, sw=0;
            rows.forEach((r,i)=>{const g=Math.max(1,gp(r)); const pts=ppr(r,p.p); if(pts>0){ppg+=(pts/g)*weights[i];sw+=weights[i]}});
            if(!sw)return null; return ppg/sw*17;
          }
          function contextFactor(p){
            const role=1+((Number(p.r??8.5)-8.5)*.018);
            const env=1+((Number(p.e??8.5)-8.5)*.012);
            const rel=1+((Number(p.rl??8.5)-8.5)*.006);
            const sust=1+((Number(p.su??8.5)-8.5)*.006);
            let avail=1;
            const a=Number(p.a??8.5);
            if(a<8.5)avail-=Math.min(.08,(8.5-a)*.018);
            const st=String(p.st||'PASS').toUpperCase();
            if(st!=='PASS'&&!st.includes('ACTIVE')&&!st.includes('HEALTHY'))avail-=.015;
            return Math.max(.88,Math.min(1.12,role*env*rel*sust*avail));
          }
          function scaleRange(text,ratio){
            if(!text||!Number.isFinite(ratio)||Math.abs(ratio-1)<.002)return text;
            return String(text).replace(/\d+(?:\.\d+)?/g,m=>{
              const n=Number(m); if(!Number.isFinite(n))return m;
              const out=n*ratio;
              if(n<20)return String(Math.max(0,Math.round(out*10)/10)).replace(/\.0$/,'');
              return String(Math.max(0,Math.round(out)));
            });
          }
          const historyIssues=[];
          for(const [name,rows] of Object.entries(hist)){
            rows.forEach(r=>{
              const season=r.Season||r.Year||'unknown';
              const rushY=get(r,['Rush Yards','Rush Yds','RushYds']);
              const recY=get(r,['Receiving Yards','Rec Yds','RecYds','Rec. Yards']);
              const carries=get(r,['Carries','Rush Att','Car']);
              const rec=get(r,['Receptions','Rec','Rec.']);
              if(has(r,['Scrim Yds'])&&has(r,['Rush Yards','Rush Yds','RushYds'])&&has(r,['Receiving Yards','Rec Yds','RecYds','Rec. Yards'])){
                const scr=get(r,['Scrim Yds']); const calc=rushY+recY;
                if(Math.abs(scr-calc)>2)historyIssues.push({name,season,type:'scrimmage_mismatch',stored:scr,calculated:calc});
              }
              if(has(r,['YPC'])&&carries>0&&has(r,['Rush Yards','Rush Yds','RushYds'])){
                const ypc=get(r,['YPC']); const calc=rushY/carries;
                if(Math.abs(ypc-calc)>.16)historyIssues.push({name,season,type:'ypc_mismatch',stored:ypc,calculated:Math.round(calc*100)/100});
              }
              if(has(r,['Yards/Reception'])&&rec>0&&has(r,['Receiving Yards','Rec Yds','RecYds','Rec. Yards'])){
                const ypr=get(r,['Yards/Reception']); const calc=recY/rec;
                if(Math.abs(ypr-calc)>.16)historyIssues.push({name,season,type:'ypr_mismatch',stored:ypr,calculated:Math.round(calc*100)/100});
              }
            });
          }
          const audit=[];
          let total=0,withHist=0,changed=0,baselineCorrections=0;
          for(const file of files){
            const arr=JSON.parse(fs.readFileSync(file,'utf8'));
            for(const p of arr){
              total++;
              const current=Number(p.mp); if(!Number.isFinite(current))continue;
              const original=Number(p.projection_context?.prior_projected_ppr);
              const base=Number.isFinite(original)?original:current;
              const oldBaseline=Number(p.projection_context?.history_baseline_ppr);
              const hb=histBaseline(p);
              if(hb!=null)withHist++;
              const years=(hist[p.n]||[]).length;
              const histWeight=years>=3?.28:years===2?.20:years===1?.12:0;
              const cf=contextFactor(p);
              const ctx=hb==null?base:hb*cf;
              let next=base*(1-histWeight)+ctx*histWeight;
              const clamp=base*.075;
              next=Math.max(base-clamp,Math.min(base+clamp,next));
              const a=Number(p.a??8.5);
              if(a<7.5)next*=.985;
              next=Math.round(next*4)/4;
              const delta=next-current;
              const ratio=current?next/current:1;
              if(Number.isFinite(oldBaseline)&&hb!=null&&Math.abs(oldBaseline-hb)>=.5)baselineCorrections++;
              p.projection_context={
                history_seasons:years,
                history_baseline_ppr:hb==null?null:Math.round(hb*10)/10,
                context_factor:Math.round(cf*1000)/1000,
                prior_projected_ppr:base,
                recalibrated_projected_ppr:next,
                note:'Historical per-game production is a baseline only. Current 2026 role, team environment, injuries, reliability and sustainability remain primary; missed games do not automatically reduce per-game ability.'
              };
              if(Math.abs(delta)>=.125){
                p.mp=next;
                p.dp=p.cp?((p.mp-p.cp)/p.cp):p.dp;
                p.m=scaleRange(p.m,ratio);
                p.cl=scaleRange(p.cl,Math.max(.96,Math.min(1.04,ratio)));
                if(Math.abs(delta)>=1)changed++;
              }
              audit.push({name:p.n,pos:p.p,team:p.t,history_seasons:years,base_projection:base,previous_current_ppr:current,new_ppr:p.mp,delta_from_previous:Math.round((p.mp-current)*100)/100,old_history_baseline:Number.isFinite(oldBaseline)?oldBaseline:null,new_history_baseline:hb==null?null:Math.round(hb*10)/10,availability:p.a,role:p.r,environment:p.e,status:p.st});
            }
            fs.writeFileSync(file,JSON.stringify(arr));
          }
          audit.sort((a,b)=>Math.abs(b.delta_from_previous)-Math.abs(a.delta_from_previous));
          const report={generated_at:new Date().toISOString(),method:'Idempotent full-player historical-context recalibration. Every run starts from the saved pre-history projection, not the previously recalibrated result. Historical production is calculated from the stored season stat rows using per-game PPR and 20/30/50 recency weighting for three-season samples.',players_checked:total,players_with_history:withHist,players_changed_at_least_1_ppr:changed,stored_baselines_corrected:baselineCorrections,changes:audit};
          fs.writeFileSync('projection-context-audit-2026.json',JSON.stringify(report,null,2)+'\n');
          fs.writeFileSync('history-integrity-audit-2026.json',JSON.stringify({generated_at:new Date().toISOString(),players_in_history:Object.keys(hist).length,internal_stat_consistency_issues:historyIssues.length,issues:historyIssues},null,2)+'\n');
          console.log(`checked ${total}; history ${withHist}; changed ${changed}; baseline corrections ${baselineCorrections}; history consistency issues ${historyIssues.length}`);
          NODE
      - name: Commit projection recalibration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add players*.json projection-context-audit-2026.json history-integrity-audit-2026.json
          git diff --cached --quiet || git commit -m 'Rebuild projections from verified historical baselines'
          git push
