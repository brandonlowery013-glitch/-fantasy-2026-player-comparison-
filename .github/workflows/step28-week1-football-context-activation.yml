name: Step 28 Week 1 Football Context Activation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step28-context-activation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Step 28 Week 1 context activation
        run: node scripts/validate-step28-week1-context-activation.mjs
      - name: Validate automatic football context adapter contract
        run: node scripts/validate-automatic-football-context-adapters.mjs
      - name: Test automatic football context collection
        run: node scripts/collect-automatic-football-context.mjs --self-test
      - name: Revalidate Step 27 state transitions
        run: node scripts/validate-step27-week1-state-transition.mjs
      - name: Revalidate Step 24 orchestration contract
        run: node scripts/validate-weekly-production-orchestration-contract.mjs
      - name: Upload Step 28 QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step28-week1-football-context-activation
          path: |
            guardrails/step28-week1-context-activation-report.json
            guardrails/automatic-football-context-adapters-contract-report.json
            guardrails/automatic-football-context-adapters-report.json
            guardrails/weekly-production-orchestration-contract-report.json
          if-no-files-found: error
