name: Interface Impact Payload

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/sources/interface-impact-payload-2026.json'
      - 'data/ingestion/interface-impact-payload-2026.json'
      - 'scripts/build-interface-impact-payload.mjs'
      - '.github/workflows/interface-impact-payload.yml'
  workflow_run:
    workflows:
      - Step 2 Connected Impact Resolver
      - Step 3 Team Scoring Market Impact Bridge
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'workflow_run'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Self-test interface payload
        run: node scripts/build-interface-impact-payload.mjs --self-test
      - name: Revalidate foundation
        run: node scripts/validate-model-foundation-contract.mjs
      - name: Run hard Guardrail QA
        run: node scripts/run-guardrail-qa.mjs

  refresh:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'workflow_run'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: write
    concurrency:
      group: production-main-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build interface payload
        run: node scripts/build-interface-impact-payload.mjs
      - name: Publish exact validated impact state through guarded PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-guarded-impact-state.sh interface
