name: Step 3B Multi-Year PPR Walk-Forward

on:
  pull_request:
    paths:
      - 'players*.json'
      - 'scripts/backtest-step3b-multiyear-ppr-walkforward.mjs'
      - 'scripts/validate-step3b-multiyear-ppr-walkforward.mjs'
      - '.github/workflows/step3b-multiyear-ppr-walkforward.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiyear-walkforward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run multi-year fantasy-relevant PPR walk-forward
        run: node scripts/backtest-step3b-multiyear-ppr-walkforward.mjs
      - name: Validate multi-year report
        run: node scripts/validate-step3b-multiyear-ppr-walkforward.mjs
      - name: Run hard Guardrail QA
        run: node scripts/run-guardrail-qa.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step3b-multiyear-ppr-walkforward
          path: guardrails/step3b-multiyear-ppr-walkforward.json
          if-no-files-found: error
