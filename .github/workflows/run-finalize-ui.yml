name: Run Finalize UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message == 'Trigger final UI patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/finalize_ui.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize comparison market layer and injury sync [skip ci]'
          git push
