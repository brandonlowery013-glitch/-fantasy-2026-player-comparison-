name: Step 24 Weekly Production Orchestration

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '10 * * * *'

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: write

concurrency:
  group: weekly-production-orchestration
  cancel-in-progress: false

jobs:
  step24-contract-qa:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Step 24 orchestration contract
        run: node scripts/validate-weekly-production-orchestration-contract.mjs
      - name: Validate game-aware cadence policy
        run: node scripts/production-cadence-gate.mjs --self-test
      - name: Validate hourly injury-change polling
        run: node scripts/poll-live-injury-changes.mjs --self-test
      - name: Validate injury-to-weekly projection policy
        run: node scripts/validate-step6-5b-automatic-injury-projection-policy.mjs
      - name: Test ordered lifecycle status builder
        run: node scripts/build-weekly-production-orchestration-status.mjs --self-test
      - name: Revalidate immutable forecast capture
        run: node scripts/capture-weekly-forecast-snapshots.mjs --self-test
      - name: Revalidate game projection independence
        run: node scripts/build-weekly-game-projections.mjs --self-test
      - name: Revalidate live market ingestion
        run: node scripts/ingest-live-market-snapshots.mjs --self-test
      - name: Revalidate postgame settlement
        run: node scripts/settle-weekly-forecast-results.mjs --self-test
      - name: Revalidate pipeline health
        run: node scripts/check-weekly-pipeline-health.mjs --self-test
      - name: Revalidate real-season chronology
        run: node scripts/validate-real-season-validation.mjs --self-test
      - name: Revalidate Step 25 production readiness
        run: |
          node scripts/validate-production-readiness-contract.mjs
          node scripts/build-production-readiness-status.mjs --self-test
      - name: Upload Step 24 QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step24-weekly-production-orchestration
          path: |
            guardrails/weekly-production-orchestration-contract-report.json
            guardrails/production-cadence-gate-report.json
            guardrails/live-injury-poll-report.json
            guardrails/weekly-production-orchestration-report.json
            guardrails/production-readiness-contract-report.json
            guardrails/production-readiness-dry-run-report.json
          if-no-files-found: error

  weekly-production-cycle:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (needs.step24-contract-qa.result == 'success' || needs.step24-contract-qa.result == 'skipped')
    needs: step24-contract-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Poll live injury state on every hourly invocation
        id: injury_poll
        run: node scripts/poll-live-injury-changes.mjs
      - name: Determine Chicago-time production cadence
        id: cadence
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INJURY_STATE_CHANGED: ${{ steps.injury_poll.outputs.changed }}
        run: node scripts/production-cadence-gate.mjs
      - name: Validate orchestration contract
        if: steps.cadence.outputs.run == 'true'
        run: node scripts/validate-weekly-production-orchestration-contract.mjs
      - name: Stage 1 - resolve source schedule
        id: source
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          node scripts/ingest-weekly-football-data.mjs
          rc=$?
          set -e
          games=$(node -e "const fs=require('fs');const p='data/calibration/weekly-event-schedule-2026.json';const x=fs.existsSync(p)?require('./'+p):{games:{}};process.stdout.write(String(Object.keys(x.games||{}).length))")
          if [ "$games" -eq 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No verified 2026 weekly source events yet; lifecycle remains waiting."
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Stage 1 - collect football context
        if: steps.source.outputs.ready == 'true'
        run: node scripts/collect-automatic-football-context.mjs
      - name: Stage 1 - rebuild source/context after collection
        if: steps.source.outputs.ready == 'true'
        run: node scripts/ingest-weekly-football-data.mjs
      - name: Stage 1 - verify football context readiness
        id: context
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          read -r schedule_week context_week context_players <<< "$(node -e "const fs=require('fs');const s=require('./data/calibration/weekly-event-schedule-2026.json');const c=require('./data/probability/weekly-football-context-raw-2026.json');process.stdout.write([s.week??'',c.week??'',Object.keys(c.players||{}).length].join(' '))")"
          if [ -z "$schedule_week" ] || [ "$schedule_week" != "$context_week" ] || [ "$context_players" -eq 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Verified schedule exists, but explicit current player availability context is not ready."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Stage 2 - normalize weekly football context
        if: steps.context.outputs.ready == 'true'
        run: node scripts/normalize-weekly-football-context.mjs
      - name: Stage 2 - build weekly player projections
        if: steps.context.outputs.ready == 'true'
        run: node scripts/build-weekly-projection-generator.mjs
      - name: Stage 2 - build weekly probability distributions
        if: steps.context.outputs.ready == 'true'
        run: node scripts/build-weekly-probability-engine.mjs
      - name: Stage 3 - freeze first valid pregame forecasts
        if: steps.context.outputs.ready == 'true'
        run: node scripts/capture-weekly-forecast-snapshots.mjs
      - name: Stage 4 - build football-only team scoring priors
        if: steps.context.outputs.ready == 'true'
        run: node scripts/build-game-team-scoring-priors.mjs
      - name: Stage 4 - build weekly NFL game projections
        if: steps.context.outputs.ready == 'true'
        run: node scripts/build-weekly-game-projections.mjs
      - name: Stage 5 - capture live market snapshots
        if: steps.context.outputs.ready == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MARKET_MAX_PROP_EVENTS: ${{ vars.MARKET_MAX_PROP_EVENTS }}
        run: node scripts/ingest-live-market-snapshots.mjs
      - name: Stage 5 - validate captured game markets
        if: steps.context.outputs.ready == 'true'
        run: node scripts/validate-weekly-matchup-market-snapshots.mjs
      - name: Stage 5 - validate captured player props
        if: steps.context.outputs.ready == 'true'
        run: node scripts/validate-player-prop-market-snapshots.mjs
      - name: Stage 6 - build game recommendations
        if: steps.context.outputs.ready == 'true'
        run: node scripts/build-game-market-recommendations.mjs
      - name: Stage 6 - build player prop recommendations
        if: steps.context.outputs.ready == 'true'
        run: node scripts/build-player-prop-recommendations.mjs
      - name: Stage 7 - build freshness-filtered opportunity board
        if: steps.context.outputs.ready == 'true'
        run: node scripts/build-unified-opportunity-engine.mjs
      - name: Stage 8 - settle any newly final frozen forecasts
        if: steps.cadence.outputs.run == 'true'
        run: node scripts/settle-weekly-forecast-results.mjs
      - name: Stage 9 - rebuild live market holdout calibration
        if: steps.cadence.outputs.run == 'true'
        run: node scripts/build-live-week-calibration.mjs
      - name: Stage 10 - rebuild calibration governance status
        if: steps.cadence.outputs.run == 'true'
        run: node scripts/build-calibration-governance-status.mjs
      - name: Stage 11 - rebuild weekly pipeline health
        if: steps.cadence.outputs.run == 'true'
        run: node scripts/check-weekly-pipeline-health.mjs
      - name: Stage 12 - rebuild real-season validation status
        if: steps.cadence.outputs.run == 'true'
        run: node scripts/validate-real-season-validation.mjs
      - name: Stage 13 - build production readiness status
        if: steps.cadence.outputs.run == 'true'
        run: node scripts/build-production-readiness-status.mjs
      - name: Stage 13 - build orchestration status
        if: steps.cadence.outputs.run == 'true'
        run: node scripts/build-weekly-production-orchestration-status.mjs
      - name: Stage 13 - atomically persist weekly lifecycle state
        id: persist
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(data/calibration/weekly-event-schedule-2026.json data/ingestion/live-injury-poll-2026.json data/ingestion/weekly-football-source-snapshots-2026.json data/probability/weekly-football-context-raw-2026.json data/probability/weekly-football-context-inputs-2026.json data/probability/weekly-projection-inputs-2026.json data/probability/generated/weekly-probability-distributions-2026.json data/calibration/weekly-forecast-capture-2026.json data/probability/generated/game-team-scoring-priors-2023-2025.json data/probability/generated/weekly-game-projections-2026.json data/market/weekly-matchup-market-snapshots-2026.json data/market/player-prop-market-snapshots-2026.json data/market/live-market-ingestion-status-2026.json data/market/weekly-game-market-recommendations-2026.json data/market/player-prop-recommendations-2026.json data/market/unified-opportunities-2026.json data/calibration/weekly-forecast-results-2026.json data/calibration/weekly-forecast-calibration-2026.json data/calibration/weekly-predictions-2026.json data/calibration/weekly-outcomes-2026.json weeklyCalibration2026.json data/calibration/calibration-governance-status-2026.json data/calibration/weekly-pipeline-status-2026.json data/calibration/real-season-validation-status-2026.json data/calibration/production-readiness-status-2026.json data/calibration/weekly-production-orchestration-status-2026.json)
          for p in "${paths[@]}"; do if [ -e "$p" ]; then git add "$p"; fi; done
          if git diff --cached --quiet; then
            echo "No weekly production state changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="production/state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m "Run ordered weekly production lifecycle"
          git push origin "HEAD:$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Stage 13 - open guarded production state PR
        id: state_pr
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "${{ steps.persist.outputs.branch }}" --title "Production: weekly lifecycle state" --body "Automated weekly production-state persistence. Generated by Step 24 run ${GITHUB_RUN_ID}. This PR contains state/output files only and must pass the repository's required full Guardrail QA on the exact protected candidate before merge.")
          pr_number="${pr_url##*/}"
          test -n "$pr_number"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Stage 13 - run Guardrail QA on exact production candidate
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.persist.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run guardrail-qa.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

          RUN_ID=''
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow guardrail-qa.yml \
              --branch "$BRANCH" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"$HEAD_SHA\" and .createdAt >= \"$DISPATCHED_AT\") | .databaseId" \
              | head -n 1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "FAIL: could not discover Guardrail QA run for exact production branch $BRANCH at head $HEAD_SHA."
            exit 1
          fi
          echo "Guardrail QA run: ${RUN_ID} (branch=${BRANCH}, head=${HEAD_SHA})"

          for _ in $(seq 1 360); do
            STATUS=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
            if [ "$STATUS" = 'completed' ]; then
              CONCLUSION=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
              RUN_HEAD=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')
              if [ "$RUN_HEAD" != "$HEAD_SHA" ]; then
                echo "FAIL: Guardrail QA head mismatch: expected $HEAD_SHA, got $RUN_HEAD."
                exit 1
              fi
              if [ "$CONCLUSION" != 'success' ]; then
                echo "FAIL: Guardrail QA concluded ${CONCLUSION}."
                exit 1
              fi
              echo "Guardrail QA passed on exact production candidate $HEAD_SHA."
              exit 0
            fi
            sleep 10
          done

          echo 'FAIL: timed out waiting for Guardrail QA.'
          exit 1

      - name: Stage 13 - merge exact validated production state PR
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.state_pr.outputs.pr_number }}
          BRANCH: ${{ steps.persist.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          run_guardrail_for_exact_head() {
            local head_sha="$1"
            local dispatched_at run_id status conclusion run_head
            dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run guardrail-qa.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
            run_id=''
            for _ in $(seq 1 60); do
              run_id=$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow guardrail-qa.yml \
                --branch "$BRANCH" \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,headSha,createdAt \
                --jq ".[] | select(.headSha == \"$head_sha\" and .createdAt >= \"$dispatched_at\") | .databaseId" \
                | head -n 1)
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 5
            done
            if [ -z "$run_id" ]; then
              echo "FAIL: could not discover refreshed Guardrail QA run for exact production head $head_sha."
              return 1
            fi
            echo "Refreshed Guardrail QA run: ${run_id} (branch=${BRANCH}, head=${head_sha})"
            for _ in $(seq 1 360); do
              status=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
              if [ "$status" = 'completed' ]; then
                conclusion=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
                run_head=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')
                if [ "$run_head" != "$head_sha" ]; then
                  echo "FAIL: refreshed Guardrail head mismatch: expected $head_sha, got $run_head."
                  return 1
                fi
                if [ "$conclusion" != 'success' ]; then
                  echo "FAIL: refreshed Guardrail QA concluded ${conclusion}."
                  return 1
                fi
                echo "Refreshed Guardrail QA passed on exact production head $head_sha."
                return 0
              fi
              sleep 10
            done
            echo "FAIL: timed out waiting for refreshed Guardrail QA on $head_sha."
            return 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main "$BRANCH"
          git switch "$BRANCH"

          for _ in $(seq 1 60); do
            STATE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')
            if [ "$STATE" = 'MERGED' ]; then
              echo "PR #${PR_NUMBER} already merged."
              exit 0
            fi

            git fetch origin main
            HEAD_SHA=$(git rev-parse HEAD)
            MAIN_SHA=$(git rev-parse origin/main)

            if ! git merge-base --is-ancestor "$MAIN_SHA" "$HEAD_SHA"; then
              echo "Protected main advanced to $MAIN_SHA after Guardrail validated $HEAD_SHA; refreshing production candidate."
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'FAIL: Step 24 production candidate conflicts with current protected main; refusing to force or bypass protection.'
                exit 1
              fi
              REFRESHED_SHA=$(git rev-parse HEAD)
              if [ "$REFRESHED_SHA" = "$HEAD_SHA" ]; then
                echo 'FAIL: expected refreshed Step 24 candidate SHA to change after base advance.'
                exit 1
              fi
              git push --force-with-lease origin "$BRANCH"
              run_guardrail_for_exact_head "$REFRESHED_SHA"
              continue
            fi

            REQUIRED_STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" --jq '[.statuses[] | select(.context == "guardrail-qa")] | sort_by(.updated_at) | last | .state // "missing"')
            if [ "$REQUIRED_STATUS" != 'success' ]; then
              echo "Required guardrail-qa commit status is ${REQUIRED_STATUS}; waiting."
              sleep 10
              continue
            fi

            if ! gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --required; then
              echo 'Required PR checks are not ready; rechecking candidate freshness before retrying.'
              sleep 10
              continue
            fi

            if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --match-head-commit "$HEAD_SHA" --merge --delete-branch; then
              echo "Merged validated Step 24 PR #${PR_NUMBER} after exact-head Guardrail and current-main freshness checks succeeded."
              exit 0
            fi
            echo 'Required status is green but protected merge is not ready; rechecking protected main before retrying.'
            sleep 10
          done

          echo "FAIL: validated Step 24 PR #${PR_NUMBER} did not become mergeable after exact-head Guardrail and current-main freshness checks."
          exit 1

      - name: Upload weekly production lifecycle state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-production-lifecycle
          path: |
            guardrails/production-cadence-gate-report.json
            guardrails/live-injury-poll-report.json
            data/ingestion/live-injury-poll-2026.json
            data/calibration/weekly-event-schedule-2026.json
            data/probability/weekly-football-context-raw-2026.json
            data/calibration/production-readiness-status-2026.json
            data/calibration/weekly-production-orchestration-status-2026.json
            guardrails/production-readiness-dry-run-report.json
            guardrails/weekly-production-orchestration-report.json
            data/calibration/weekly-pipeline-status-2026.json
            data/calibration/real-season-validation-status-2026.json
            data/market/live-market-ingestion-status-2026.json
          if-no-files-found: warn
