name: Step 1 Automatic NFL Event Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  pull_request:
    paths:
      - 'data/sources/nfl-event-ingestion-2026.json'
      - 'data/ingestion/nfl-event-ledger-2026.json'
      - 'data/ingestion/nfl-event-state-2026.json'
      - 'scripts/build-nfl-event-ingestion.mjs'
      - 'scripts/validate-nfl-event-ingestion.mjs'
      - 'scripts/merge-guarded-production-pr.sh'
      - '.github/workflows/step1-automatic-nfl-event-ingestion.yml'

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read

concurrency:
  group: automatic-nfl-event-ingestion
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate event contract and guardrails
        run: node scripts/validate-nfl-event-ingestion.mjs
      - name: Test reverse-state and role-change detection
        run: node scripts/build-nfl-event-ingestion.mjs --self-test

  ingest:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: production-main-writer
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Poll ESPN roster depth-chart and injury state
        run: node scripts/build-nfl-event-ingestion.mjs
      - name: Revalidate normalized event ledger
        run: node scripts/validate-nfl-event-ingestion.mjs

      - name: Persist event state through protected PR
        id: persist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ingestion/nfl-event-ledger-2026.json data/ingestion/nfl-event-state-2026.json

          if git diff --cached --quiet; then
            echo "No event-state changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="production/nfl-event-ingestion-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git commit -m "Update automatic NFL event state [skip ci]"
          git push --set-upstream origin "$BRANCH"

          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "Update automatic NFL event state" \
              --body "Automated event-ledger/state refresh. Merge only after the shared production handoff refreshes against current main and Guardrail QA validates the exact protected candidate.")
            PR_NUMBER="${PR_URL##*/}"
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Opened protected update PR #${PR_NUMBER} from ${BRANCH}."

      - name: Refresh exact candidate, run Guardrail, and merge event state
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/merge-guarded-production-pr.sh "${{ steps.persist.outputs.pr_number }}" "${{ steps.persist.outputs.branch }}" squash
