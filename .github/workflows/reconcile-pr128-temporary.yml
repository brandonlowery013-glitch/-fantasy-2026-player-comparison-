name: Reconcile PR 128 with current main

on:
  push:
    branches:
      - model/add-kaleb-johnson-163

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[reconciled-pr128]') && !contains(github.event.head_commit.message, 'Remove temporary PR 128 reconciliation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model/add-kaleb-johnson-163
          fetch-depth: 0
      - name: Fetch current main
        run: git fetch origin main:refs/remotes/origin/main
      - name: Rebuild player universe from current main
        run: node scripts/reconcile-pr128-with-main.mjs
      - name: Commit reconciled player state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players*.json current162patch-2026-08-24.json lockedRanks2026.json
          if git diff --cached --quiet; then
            echo "No reconciliation changes required"
            exit 0
          fi
          git commit -m "[reconciled-pr128] Rebase player universe onto current main"
          git push origin HEAD:model/add-kaleb-johnson-163
