name: Apply Systemic Production Writer Lock

on:
  push:
    branches: [fix/systemic-production-handoff-v2]
    paths:
      - '.github/workflows/apply-systemic-production-lock.yml'

permissions:
  contents: write

jobs:
  patch-production-writers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/systemic-production-handoff-v2
          fetch-depth: 0
      - name: Add shared production-main writer lock everywhere it is needed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('.github/workflows')
          changed=[]
          audited=[]

          def is_writer(block):
              text='\n'.join(block)
              if 'gh pr create' in text:
                  return True
              for line in block:
                  s=line.strip()
                  if s == 'git push':
                      return True
                  if re.search(r'\bgit\s+push\b.*\bHEAD:main\b', s):
                      return True
                  if re.search(r'\bgit\s+push\b.*\borigin\s+main\b', s):
                      return True
              return False

          for path in sorted(root.glob('*.y*ml')):
              if path.name == 'apply-systemic-production-lock.yml':
                  continue
              lines=path.read_text().splitlines()
              try:
                  jobs_i=next(i for i,l in enumerate(lines) if l.strip()=='jobs:' and not l.startswith(' '))
              except StopIteration:
                  continue

              starts=[]
              for i in range(jobs_i+1,len(lines)):
                  m=re.match(r'^  ([A-Za-z0-9_.-]+):\s*$',lines[i])
                  if m:
                      starts.append((i,m.group(1)))
              if not starts:
                  continue

              replacements=[]
              for n,(start,name) in enumerate(starts):
                  end=starts[n+1][0] if n+1<len(starts) else len(lines)
                  block=lines[start:end]
                  if not is_writer(block):
                      continue
                  audited.append(f'{path}:{name}')

                  cidx=None
                  cend=None
                  for j in range(start+1,end):
                      if lines[j].startswith('    concurrency:'):
                          cidx=j
                          k=j+1
                          while k<end and (not lines[k].strip() or len(lines[k])-len(lines[k].lstrip())>4):
                              k+=1
                          cend=k
                          break
                  newblock=[
                      '    concurrency:',
                      "      group: ${{ github.event_name == 'pull_request' && format('pr-validation-{0}', github.run_id) || 'production-main-writer' }}",
                      '      cancel-in-progress: false',
                  ]
                  if cidx is not None:
                      replacements.append((cidx,cend,newblock))
                  else:
                      replacements.append((start+1,start+1,newblock))

              if replacements:
                  for a,b,new in reversed(replacements):
                      lines[a:b]=new
                  path.write_text('\n'.join(lines)+'\n')
                  changed.append(str(path))

          if not audited:
              raise SystemExit('FAIL: no production writer jobs detected')
          print('Production writer jobs locked:')
          for x in audited: print(' -',x)
          print('Changed workflow files:',len(changed))
          PY

      - name: Verify known automatic writers are covered
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          required={
            '.github/workflows/step1-automatic-nfl-event-ingestion.yml':'ingest',
            '.github/workflows/live-news-model-ingestion.yml':'live-news-model-ingestion',
            '.github/workflows/final-betting-pipeline-step4.yml':'live-week-sync',
            '.github/workflows/adaptive-market-refresh.yml':'adaptive-market-refresh',
            '.github/workflows/adaptive-player-prop-refresh.yml':'adaptive-player-prop-refresh',
            '.github/workflows/step24-weekly-production-orchestration.yml':'weekly-production-cycle',
            '.github/workflows/weekly-player-outlook.yml':'weekly-player-outlook',
            '.github/workflows/step23-live-market-ingestion.yml':'manual-live-market-refresh',
            '.github/workflows/sync-canonical-boards.yml':'sync',
          }
          for f,job in required.items():
              text=Path(f).read_text()
              marker=f'  {job}:'
              if marker not in text:
                  raise SystemExit(f'FAIL: required writer job missing: {f}:{job}')
              tail=text.split(marker,1)[1]
              if "production-main-writer" not in tail.split('\n  ',1)[0]:
                  raise SystemExit(f'FAIL: shared production lock missing: {f}:{job}')
          print(f'PASS: {len(required)} known production writers share the production-main-writer lock')
          PY

      - name: Commit lock coverage, remove one-time patcher, and refresh from current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-systemic-production-lock.yml
          git add .github/workflows
          git commit -m "Serialize all automatic production writers"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:fix/systemic-production-handoff-v2
