name: Step 16 Player Prop Recommendations

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'data/probability/generated/weekly-probability-distributions-2026.json'
      - 'data/probability/weekly-projection-inputs-2026.json'
      - 'data/market/player-prop-market-snapshots-2026.json'
      - 'scripts/build-player-prop-recommendations.mjs'
      - '.github/workflows/step16-player-prop-recommendations.yml'

permissions:
  contents: write

jobs:
  step16-player-prop-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate player prop snapshot schema
        run: node scripts/validate-player-prop-market-snapshots.mjs --self-test
      - name: Validate Step 16 contract
        run: node scripts/validate-player-prop-recommendation-contract.mjs
      - name: Test 162-player season and weekly PICK/PASS logic
        run: node scripts/build-player-prop-recommendations.mjs --self-test
      - name: Revalidate shared fair-market formula
        run: node scripts/test-ev-math.mjs
      - name: Revalidate game recommendation thresholds
        run: node scripts/validate-game-market-recommendation-contract.mjs

  build-player-prop-recommendations:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: step16-player-prop-qa
    runs-on: ubuntu-latest
    concurrency:
      group: player-prop-recommendation-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate current football distributions
        run: node scripts/build-weekly-probability-engine.mjs
      - name: Validate stored player prop snapshots
        run: node scripts/validate-player-prop-market-snapshots.mjs
      - name: Build player prop recommendations
        run: node scripts/build-player-prop-recommendations.mjs
      - name: Persist recommendation state to guarded branch
        run: |
          BRANCH="production/player-prop-recs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/market/player-prop-recommendations-2026.json guardrails/player-prop-market-snapshot-report.json
          if git diff --cached --quiet; then
            echo "No player prop recommendation changes"
            exit 0
          fi
          git commit -m "Production: refresh player prop recommendations"
          git push origin "$BRANCH"
          echo "production_branch=$BRANCH" >> "$GITHUB_STEP_SUMMARY"
