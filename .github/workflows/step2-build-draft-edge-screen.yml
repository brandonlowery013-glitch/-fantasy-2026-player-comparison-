name: Step 2 Build 166 Draft Edge Screen
on:
  push:
    branches: [model/step2-166-edge-opportunity-screen]
    paths:
      - 'scripts/build-draft-edge-opportunity-screen.mjs'
      - '.trigger-step2-edge-screen'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model/step2-166-edge-opportunity-screen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build 166-player edge screen
        run: node scripts/build-draft-edge-opportunity-screen.mjs
      - name: Validate screen
        run: |
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('data/market/draft-edge-opportunity-screen-166.json','utf8'));
          if(x.universe!==166||x.players.length!==166||new Set(x.players.map(p=>p.player)).size!==166)throw Error('166-player coverage failed');
          if(x.authority!=='COMPANION_ONLY_NO_INTRINSIC_RANK_MUTATION')throw Error('authority contract failed');
          if(x.price_pending.length!==4)throw Error(`expected 4 price-pending admissions, got ${x.price_pending.length}`);
          console.log({universe:x.universe,price_coverage:x.price_coverage,counts:x.counts,price_pending:x.price_pending});
          NODE
      - name: Commit generated screen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/draft-edge-opportunity-screen-166.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate Step 2 166-player edge opportunity screen [skip ci]"
          git push origin HEAD:model/step2-166-edge-opportunity-screen
