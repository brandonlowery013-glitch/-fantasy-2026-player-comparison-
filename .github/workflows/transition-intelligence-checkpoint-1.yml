name: Transition Intelligence Checkpoint 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transition-intelligence-checkpoint-1.yml'

permissions:
  contents: read

jobs:
  checkpoint-1-historical-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate existing regular-season authority
        run: node scripts/validate-season-phase-transition.mjs
      - name: Build source ledger prerequisite
        run: |
          node scripts/build-live-full-universe-review-v2.mjs
          node scripts/normalize-nfl-article-bodies.mjs
          node scripts/normalize-tracked-signal-teams.mjs
          node scripts/hydrate-current-football-review-positions.mjs
      - name: Build historical official-team archive
        env:
          OFFICIAL_TEAM_SITEMAP_START: '2026-04-01T00:00:00Z'
          OFFICIAL_TEAM_SITEMAP_END: '2026-09-04T23:59:59Z'
          OFFICIAL_TEAM_SITEMAP_MAX_ARTICLES: '160'
          OFFICIAL_TEAM_SITEMAP_MAX_CHILDREN: '48'
        run: node scripts/collect-official-team-sitemaps.mjs
      - name: Build historical player-news archive
        env:
          PLAYER_NEWS_RSS_START: '2026-04-01T00:00:00Z'
          PLAYER_NEWS_RSS_END: '2026-09-04T23:59:59Z'
          PLAYER_NEWS_RSS_MAX: '60'
        run: node scripts/collect-player-news-rss.mjs
      - name: Validate checkpoint 1 archive
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('MODEL_SOURCE_OF_TRUTH.json','utf8'));
          const ledger=JSON.parse(fs.readFileSync('guardrails/current-football-review.json','utf8'));
          const expected=Number(src.active_player_model);
          if((ledger.players||[]).length!==expected) throw new Error(`Checkpoint 1 player coverage mismatch ${(ledger.players||[]).length}/${expected}`);
          const sq=ledger.source_quality||{};
          if(sq.official_team_sitemap_ingestion!==true) throw new Error('Official-team historical archive missing');
          if(sq.player_external_news_rss!==true) throw new Error('Player-news historical archive missing');
          const rssChecked=(ledger.players||[]).filter(p=>p.retroactive_player_news_search?.status==='CHECKED').length;
          const teamChecked=(sq.official_team_sitemap_checked_teams||[]).length;
          if(teamChecked<1) throw new Error('No official-team sources checked');
          if(rssChecked<1) throw new Error('No player RSS sources checked');
          console.log(JSON.stringify({result:'PASS',players:expected,official_teams_checked:teamChecked,rss_players_checked:rssChecked,official_articles_fetched:sq.official_team_sitemap_articles_fetched||0,direct_mentions:sq.official_team_sitemap_direct_mentions_added||0,team_context_assignments:sq.official_team_sitemap_team_context_assignments_added||0,rss_queries:sq.player_external_news_rss_queries_fetched||0,rss_mentions:sq.player_external_news_rss_mentions_added||0},null,2));
          NODE
      - name: Upload checkpoint 1 historical archive
        uses: actions/upload-artifact@v4
        with:
          name: transition-intelligence-checkpoint-1-historical-archive
          path: |
            guardrails/current-football-review.json
            guardrails/season-phase-transition-report.json
          if-no-files-found: error
          retention-days: 30
