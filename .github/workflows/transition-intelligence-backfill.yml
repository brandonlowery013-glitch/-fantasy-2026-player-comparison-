name: Full Universe Transition Intelligence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build-transition-intelligence-review.mjs'
      - 'scripts/enrich-transition-from-unified-evidence.mjs'
      - 'scripts/build-rookie-development-review.mjs'
      - 'scripts/enforce-offensive-transition-clusters.mjs'
      - 'scripts/build-chronological-transition-context.mjs'
      - 'scripts/integrate-transition-intelligence.mjs'
      - '.github/workflows/transition-intelligence-backfill.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build-transition-intelligence-review.mjs'
      - 'scripts/enrich-transition-from-unified-evidence.mjs'
      - 'scripts/build-rookie-development-review.mjs'
      - 'scripts/enforce-offensive-transition-clusters.mjs'
      - 'scripts/build-chronological-transition-context.mjs'
      - 'scripts/integrate-transition-intelligence.mjs'
      - '.github/workflows/transition-intelligence-backfill.yml'
  schedule:
    - cron: '15 13 * 4-9 1,4'

permissions:
  contents: read

jobs:
  transition-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build current football review prerequisite
        run: |
          node scripts/build-live-full-universe-review-v2.mjs
          node scripts/normalize-nfl-article-bodies.mjs
          node scripts/filter-live-review-materiality.mjs
      - name: Build enrich and integrate full-universe transition intelligence
        env:
          TRANSITION_LOOKBACK_START: '2026-04-01T00:00:00Z'
        run: |
          node scripts/build-transition-intelligence-review.mjs
          node scripts/enrich-transition-from-unified-evidence.mjs
          node scripts/integrate-transition-intelligence.mjs
      - name: Validate full transition rookie cluster and chronology coverage
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('MODEL_SOURCE_OF_TRUTH.json','utf8'));
          const report=JSON.parse(fs.readFileSync('analysis/transition-intelligence-current.json','utf8'));
          const rookie=JSON.parse(fs.readFileSync('analysis/rookie-development-review-current.json','utf8'));
          const integration=JSON.parse(fs.readFileSync('guardrails/transition-intelligence-integration-report.json','utf8'));
          const review=JSON.parse(fs.readFileSync('guardrails/current-football-review.json','utf8'));
          const expected=Number(src.active_player_model);
          if((report.rows||[]).length!==expected) throw new Error(`Transition coverage ${(report.rows||[]).length}/${expected}`);
          if(new Set((report.rows||[]).map(x=>x.player)).size!==expected) throw new Error('Transition intelligence duplicate/missing players');
          if(Number(rookie.counts?.players_checked)!==expected) throw new Error(`Rookie metadata coverage ${rookie.counts?.players_checked}/${expected}`);
          if((rookie.rookies||[]).some(x=>x.development_review?.required!==true)) throw new Error('Rookie development review missing');
          const missing=(review.players||[]).filter(x=>x.transition_intelligence?.review_status!=='REVIEWED');
          if(missing.length) throw new Error(`Players missing proactive transition review: ${missing.map(x=>x.player).join(', ')}`);
          if(report.chronological_context?.mandatory!==true) throw new Error('Chronological context pass missing');
          if(report.offensive_transition_cluster?.mandatory!==true) throw new Error('Offensive transition cluster pass missing');
          if(integration.result!=='PASS'||integration.coverage!==expected) throw new Error('Transition integration did not pass');
          const evidenceFound=(report.rows||[]).filter(x=>x.transition_signal==='EVIDENCE_FOUND').length;
          if(evidenceFound===0) throw new Error('False-green blocked: transition sweep produced zero evidence after validated fallback');
          console.log(JSON.stringify({result:'PASS',coverage:expected,evidence_found:evidenceFound,rookies:integration.rookie_players,rookies_with_evidence:integration.rookies_with_dated_development_evidence,rookies_no_dated_evidence:integration.rookies_reviewed_no_dated_evidence,rookie_unresolved:integration.rookie_classification_unresolved,transition_teams:integration.offensive_transition_teams,cluster_players:integration.offensive_transition_cluster_players,timeline_players:integration.players_with_chronological_timeline,current_state_players:integration.players_with_current_state_basis,recovery_players:integration.players_with_prior_season_recovery_signals},null,2));
          NODE
      - name: Upload transition intelligence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-universe-transition-intelligence
          path: |
            analysis/transition-intelligence-current.json
            analysis/transition-intelligence-current.md
            analysis/rookie-development-review-current.json
            guardrails/current-football-review.json
            guardrails/transition-intelligence-integration-report.json
          if-no-files-found: error
