name: Full Universe Transition Intelligence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/season-phase-2026.json'
      - 'data/sources/season-phase-2026.json'
      - 'scripts/build-transition-intelligence-review.mjs'
      - 'scripts/enrich-transition-from-unified-evidence.mjs'
      - 'scripts/collect-official-team-sitemaps.mjs'
      - 'scripts/collect-player-news-rss.mjs'
      - 'scripts/hydrate-current-football-review-positions.mjs'
      - 'scripts/build-retroactive-camp-backfill.mjs'
      - 'scripts/filter-retroactive-position-evidence-quality.mjs'
      - 'scripts/run-position-specific-transition-integration.mjs'
      - 'scripts/build-rookie-development-review.mjs'
      - 'scripts/enforce-offensive-transition-clusters.mjs'
      - 'scripts/build-chronological-transition-context.mjs'
      - 'scripts/build-player-storyline-state.mjs'
      - 'scripts/build-full-universe-accumulated-context-audit.mjs'
      - 'scripts/reconcile-audit-with-player-storylines.mjs'
      - 'analysis/player-scouting-context-recovered-2026-09-05.json'
      - 'analysis/scouting-context-payload/**'
      - 'scripts/integrate-transition-intelligence.mjs'
      - 'scripts/normalize-tracked-signal-teams.mjs'
      - 'scripts/validate-season-phase-transition.mjs'
      - '.github/workflows/transition-intelligence-backfill.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build-transition-intelligence-review.mjs'
      - 'scripts/enrich-transition-from-unified-evidence.mjs'
      - 'scripts/hydrate-current-football-review-positions.mjs'
      - 'scripts/build-retroactive-camp-backfill.mjs'
      - 'scripts/filter-retroactive-position-evidence-quality.mjs'
      - 'scripts/run-position-specific-transition-integration.mjs'
      - 'scripts/build-chronological-transition-context.mjs'
      - 'scripts/build-player-storyline-state.mjs'
      - 'scripts/build-full-universe-accumulated-context-audit.mjs'
      - 'scripts/reconcile-audit-with-player-storylines.mjs'
      - 'analysis/player-scouting-context-recovered-2026-09-05.json'
      - 'analysis/scouting-context-payload/**'
      - 'scripts/integrate-transition-intelligence.mjs'
  schedule:
    - cron: '15 13 * 4-9 1,4'

permissions:
  contents: read

jobs:
  transition-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate existing regular-season authority
        run: node scripts/validate-season-phase-transition.mjs
      - name: Build current football review prerequisite
        run: |
          node scripts/build-live-full-universe-review-v2.mjs
          node scripts/normalize-nfl-article-bodies.mjs
          node scripts/normalize-tracked-signal-teams.mjs
          node scripts/hydrate-current-football-review-positions.mjs
      - name: Deep retroactive camp source discovery
        env:
          OFFICIAL_TEAM_SITEMAP_START: '2026-04-01T00:00:00Z'
          OFFICIAL_TEAM_SITEMAP_END: '2026-09-04T23:59:59Z'
          OFFICIAL_TEAM_SITEMAP_MAX_ARTICLES: '160'
          OFFICIAL_TEAM_SITEMAP_MAX_CHILDREN: '48'
          PLAYER_NEWS_RSS_START: '2026-04-01T00:00:00Z'
          PLAYER_NEWS_RSS_END: '2026-09-04T23:59:59Z'
          PLAYER_NEWS_RSS_MAX: '60'
        run: |
          node scripts/collect-official-team-sitemaps.mjs
          node scripts/collect-player-news-rss.mjs
      - name: Filter current materiality without erasing historical source archive
        run: node scripts/filter-live-review-materiality.mjs
      - name: Build enrich quality-filter and integrate full-universe transition intelligence
        env:
          TRANSITION_LOOKBACK_START: '2026-04-01T00:00:00Z'
        run: |
          node scripts/build-transition-intelligence-review.mjs
          node scripts/enrich-transition-from-unified-evidence.mjs
          node scripts/run-position-specific-transition-integration.mjs
      - name: Validate retroactive camp and regular-season authority
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=JSON.parse(fs.readFileSync('MODEL_SOURCE_OF_TRUTH.json','utf8'));
          const report=JSON.parse(fs.readFileSync('analysis/transition-intelligence-current.json','utf8'));
          const integration=JSON.parse(fs.readFileSync('guardrails/transition-intelligence-integration-report.json','utf8'));
          const camp=JSON.parse(fs.readFileSync('guardrails/retroactive-camp-backfill-report.json','utf8'));
          const phase=JSON.parse(fs.readFileSync('guardrails/season-phase-transition-report.json','utf8'));
          const expected=Number(src.active_player_model);
          if((report.rows||[]).length!==expected||Number(camp.counts?.players)!==expected) throw new Error('Full-universe retroactive coverage missing');
          if(phase.result!=='PASS'||phase.football_state!=='REGULAR_SEASON_ACTIVE'||phase.fantasy_draft_state_gate!==false) throw new Error('Regular-season authority contract invalid');
          const statuses=new Set((camp.rows||[]).map(x=>x.status));
          for(const s of statuses) if(!['EVIDENCE_FOUND','SOURCE_CHECKED_NO_MATERIAL_EVIDENCE','SOURCE_COVERAGE_GAP'].includes(s)) throw new Error(`Invalid retroactive status ${s}`);
          if(Number(camp.counts?.source_coverage_gap)===expected) throw new Error('Retroactive source discovery failed for entire universe');
          const pc=camp.position_counts||{};
          const resolved=['RB','QB','WR','TE'].reduce((n,k)=>n+Number(pc[k]?.players||0),0);
          if(resolved!==expected||Number(pc.OTHER?.players||0)!==0) throw new Error(`Position-specific audit not applied to canonical universe: resolved=${resolved}/${expected}, OTHER=${pc.OTHER?.players||0}`);
          if(!camp.quality_policy||Number(camp.counts?.quality_rejected||0)<1) throw new Error('Retroactive position evidence quality gate did not execute');
          if(report.chronological_context?.mandatory!==true) throw new Error('Chronological context missing');
          if(integration.result!=='PASS') throw new Error('Transition integration failed');
          console.log(JSON.stringify({result:'PASS',coverage:expected,position_counts:pc,camp_evidence_players:integration.retroactive_camp_evidence_players,camp_checked_no_material:integration.retroactive_camp_source_checked_no_material,camp_source_gaps:integration.retroactive_camp_source_gaps,camp_evidence_added:integration.retroactive_camp_evidence_added,quality_rejected:camp.counts?.quality_rejected,editorial_without_event_rejected:camp.counts?.editorial_without_event_rejected,no_operational_anchor_rejected:camp.counts?.no_operational_anchor_rejected,timeline_players:integration.players_with_chronological_timeline,current_regular_season_state_players:integration.players_with_current_state_basis,football_state:phase.football_state,fantasy_draft_state_gate:phase.fantasy_draft_state_gate},null,2));
          NODE
      - name: Build persistent 166-player storyline state
        run: node scripts/build-player-storyline-state.mjs
      - name: Audit all 166 players from accumulated context
        run: node scripts/build-full-universe-accumulated-context-audit.mjs
      - name: Reconcile recalibration candidates against player storylines
        run: node scripts/reconcile-audit-with-player-storylines.mjs
      - name: Upload transition intelligence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-universe-transition-intelligence
          path: |
            analysis/transition-intelligence-current.json
            analysis/transition-intelligence-current.md
            analysis/rookie-development-review-current.json
            analysis/player-storyline-state-current.json
            analysis/player-storyline-state-current.md
            analysis/full-universe-accumulated-context-audit-current.json
            analysis/full-universe-accumulated-context-audit-current.md
            guardrails/current-football-review.json
            guardrails/retroactive-camp-backfill-report.json
            guardrails/transition-intelligence-integration-report.json
            guardrails/season-phase-transition-report.json
          if-no-files-found: error
