name: Current 197-player read-only QA

# Filename retained because universe reconciliation audits reference this contract.
on:
  pull_request:
    paths:
      - 'players*.json'
      - 'guardrails/guardrails-config.json'
      - 'MODEL_SOURCE_OF_TRUTH.json'
      - '.github/workflows/final-162-qa-publish.yml'
  push:
    branches: [main]
    paths:
      - 'players*.json'
      - 'guardrails/guardrails-config.json'
      - '.github/workflows/final-162-qa-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate complete locked player universe without publishing changes
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          from collections import Counter
          config=json.loads(Path('guardrails/guardrails-config.json').read_text())
          if config['authoritative_player_count']!=197 or config['authoritative_player_shards']!=16:
              raise SystemExit('Update this contract explicitly when the approved universe changes')
          files=sorted(Path('.').glob('players*.json'),key=lambda p:int(p.stem[7:]))
          if [p.name for p in files]!=[f'players{i}.json' for i in range(16)]:
              raise SystemExit('Expected exactly 16 contiguous player shards')
          parts=[]
          for path in files:
              shard=json.loads(path.read_text())
              if not isinstance(shard,list): raise SystemExit(f'{path} is not a list')
              parts.extend(shard)
          if len(parts)!=197: raise SystemExit(f'Expected 197 active players, found {len(parts)}')
          names=[p.get('n') for p in parts]
          if any(not n for n in names) or len(set(names))!=197:
              raise SystemExit('Missing or duplicate player identities')
          for field in ['o','tr']:
              if sorted(p.get(field,0) for p in parts)!=list(range(1,198)):
                  raise SystemExit(f'{field} ranks must be unique 1-197')
          for p in parts:
              for field in config['required_player_numeric_fields']:
                  value=p.get(field)
                  if not isinstance(value,(int,float)) or isinstance(value,bool) or not math.isfinite(value):
                      raise SystemExit(f'{p["n"]}: invalid {field}')
          source=json.loads(Path('MODEL_SOURCE_OF_TRUTH.json').read_text())
          if source['active_player_model']!=197 or source['runtime_player_shards']!=16:
              raise SystemExit('Source of truth must match the complete 197-player, 16-shard universe')
          print(json.dumps({'status':'PASS','active_players':197,'shards':16,'model_modified':False}))
          PY
      - name: Confirm validation leaves the model unchanged
        run: git diff --exit-code
