name: Onboard Kaleb Johnson and migrate universe to 163
on:
  push:
    branches: [model/add-kaleb-johnson-163]
    paths:
      - 'players13.json'
      - 'scripts/migrate-universe-162-to-163.mjs'
      - '.github/workflows/onboard-kaleb-johnson-163.yml'
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model/add-kaleb-johnson-163
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic 162 to 163 migration and onboarding audits
        run: node scripts/migrate-universe-162-to-163.mjs
      - name: Validate generated canonical and effective player universe
        run: |
          node - <<'NODE'
          const fs=require('fs');
          let p=[]; for(let i=0;i<14;i++) p=p.concat(JSON.parse(fs.readFileSync(`players${i}.json`)));
          const patch=JSON.parse(fs.readFileSync('current162patch-2026-08-24.json'));
          const effective=p.map(x=>({...x,...(patch.players?.[x.n]||{})}));
          for(const [label,rows] of [['canonical',p],['effective',effective]]){
            if(rows.length!==163) throw Error(`${label}: Expected 163 players, found ${rows.length}`);
            if(new Set(rows.map(x=>x.n)).size!==163) throw Error(`${label}: Duplicate player names`);
            for(const f of ['o','tr']) { const a=rows.map(x=>x[f]).sort((a,b)=>a-b); a.forEach((v,i)=>{if(v!==i+1)throw Error(`${label}: ${f} rank gap/collision at ${i+1}`)}); }
          }
          const k=effective.find(x=>x.n==='Kaleb Johnson'); if(!k) throw Error('Kaleb Johnson missing');
          for(const f of ['pd','ce','r','e','a','rl','su','mp','m','cl','px','s7']) if(k[f]==null) throw Error(`Kaleb missing ${f}`);
          console.log(JSON.stringify({players:effective.length,kaleb:{o:k.o,tr:k.tr,pr:k.pr,tp:k.tp,mp:k.mp,px:k.px}},null,2));
          NODE
      - name: Commit generated 163-player migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/final-162-qa-publish.yml
          git add players*.json current162patch-2026-08-24.json index-backup.html lockedRanks2026.json injuryOverrides2026.json comparison-sync-162-audit.json kaleb-johnson-163-onboarding-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Migrate Fantasy 2026 universe from 162 to 163"
          git push origin HEAD:model/add-kaleb-johnson-163
