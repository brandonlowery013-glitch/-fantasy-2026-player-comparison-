name: Onboard regular-season admissions; migrate universe to 166
on:
  push:
    branches: [model/add-kaleb-johnson-163]
    paths:
      - 'players13.json'
      - 'scripts/migrate-universe-162-to-163.mjs'
      - 'scripts/apply-packers-jacobs-exempt-update.mjs'
      - '.github/workflows/onboard-kaleb-johnson-163.yml'
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model/add-kaleb-johnson-163
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic 162 to 166 migration and onboarding audits
        run: node scripts/migrate-universe-162-to-163.mjs
      - name: Apply current Packers backfield availability and opportunity propagation
        run: node scripts/apply-packers-jacobs-exempt-update.mjs
      - name: Validate generated canonical and effective player universe
        run: |
          node - <<'NODE'
          const fs=require('fs');
          let p=[]; for(let i=0;i<14;i++) p=p.concat(JSON.parse(fs.readFileSync(`players${i}.json`)));
          const patch=JSON.parse(fs.readFileSync('current162patch-2026-08-24.json'));
          const effective=p.map(x=>({...x,...(patch.players?.[x.n]||{})}));
          for(const [label,rows] of [['canonical',p],['effective',effective]]){
            if(rows.length!==166) throw Error(`${label}: Expected 166 players, found ${rows.length}`);
            if(new Set(rows.map(x=>x.n)).size!==166) throw Error(`${label}: Duplicate player names`);
            for(const f of ['o','tr']) { const a=rows.map(x=>x[f]).sort((a,b)=>a-b); a.forEach((v,i)=>{if(v!==i+1)throw Error(`${label}: ${f} rank gap/collision at ${i+1}`)}); }
          }
          for(const name of ['Kaleb Johnson','Jonnu Smith','Corey Kiner','Tank Dell']){
            const x=effective.find(p=>p.n===name); if(!x) throw Error(`${name} missing`);
            for(const f of ['pd','ce','r','e','a','rl','su','mp','m','cl','px','s7']) if(x[f]==null) throw Error(`${name} missing ${f}`);
          }
          for(const [name,expected] of Object.entries({'Josh Jacobs':202,'MarShawn Lloyd':142,'Kaleb Johnson':108})){
            const x=effective.find(p=>p.n===name); if(!x) throw Error(`${name} missing after Packers propagation`);
            if(Number(x.mp)!==expected) throw Error(`${name} projected PPR ${x.mp} != ${expected}`);
          }
          const out={players:effective.length};
          for(const name of ['Kaleb Johnson','Jonnu Smith','Corey Kiner','Tank Dell','Josh Jacobs','MarShawn Lloyd']){const x=effective.find(p=>p.n===name);out[name]={o:x.o,tr:x.tr,pr:x.pr,tp:x.tp,mp:x.mp,px:x.px,st:x.st};}
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Commit generated 166-player migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/final-162-qa-publish.yml || true
          git add players*.json current162patch-2026-08-24.json index-backup.html lockedRanks2026.json injuryOverrides2026.json comparison-sync-162-audit.json kaleb-johnson-163-onboarding-audit.json packers-jacobs-exempt-update-2026-08-31.json
          git diff --cached --quiet && exit 0
          git commit -m "Propagate Jacobs exempt-list Packers backfield changes"
          git push origin HEAD:model/add-kaleb-johnson-163
