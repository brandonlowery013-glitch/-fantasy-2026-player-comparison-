name: Guardrail Failure Publisher

on:
  workflow_run:
    workflows:
      - Guardrail QA
    types:
      - completed

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  publish-failed-required-check:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish explicit failed guardrail-qa check on protected synthetic merge
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        shell: bash
        run: |
          set -euo pipefail

          PR_NUMBER='${{ github.event.workflow_run.pull_requests[0].number }}'
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${SOURCE_HEAD_BRANCH}" --jq '.[0].number // empty')
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR is associated with failed Guardrail QA run; nothing to publish."
            exit 0
          fi

          TARGET_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merge_commit_sha // empty')
          if [ -z "$TARGET_SHA" ]; then
            echo "FAIL: PR #${PR_NUMBER} has no synthetic merge commit SHA."
            exit 1
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='guardrail-qa' \
            -f head_sha="$TARGET_SHA" \
            -f status='completed' \
            -f conclusion='failure' \
            -f details_url="$SOURCE_RUN_URL" \
            -f output[title]='Guardrail QA failed' \
            -f output[summary]="Guardrail QA ended with ${RUN_CONCLUSION} for PR #${PR_NUMBER}. The protected synthetic merge is explicitly blocked." >/dev/null

          echo "Published explicit failed guardrail-qa check on protected merge SHA ${TARGET_SHA} for PR #${PR_NUMBER}."
