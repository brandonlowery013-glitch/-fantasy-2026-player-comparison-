name: Step 17 Unified Opportunity Engine

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '50 */6 * * *'

permissions:
  contents: write

jobs:
  step17-unified-opportunity-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Step 17 contract
        run: node scripts/validate-unified-opportunity-contract.mjs
      - name: Test unified ranking and explanation logic
        run: node scripts/build-unified-opportunity-engine.mjs --self-test
      - name: Revalidate Step 15 recommendation contract
        run: node scripts/validate-game-market-recommendation-contract.mjs
      - name: Revalidate Step 16 recommendation contract
        run: node scripts/validate-player-prop-recommendation-contract.mjs
      - name: Revalidate shared fair-market formula
        run: node scripts/test-ev-math.mjs
      - name: Upload Step 17 QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step17-unified-opportunity-engine
          path: |
            guardrails/unified-opportunity-contract-report.json
            guardrails/unified-opportunity-engine-report.json
          if-no-files-found: error

  scheduled-unified-opportunity-refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: step17-unified-opportunity-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Step 17 contract
        run: node scripts/validate-unified-opportunity-contract.mjs
      - name: Build unified weekly opportunity board
        run: node scripts/build-unified-opportunity-engine.mjs
      - name: Commit unified opportunity refresh
        run: |
          if git diff --quiet -- data/market/unified-opportunities-2026.json; then
            echo "No unified opportunity changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/unified-opportunities-2026.json
          git commit -m "Refresh unified weekly opportunities"
          git push origin HEAD:main
      - name: Upload unified opportunity output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-weekly-opportunities
          path: |
            data/market/unified-opportunities-2026.json
            guardrails/unified-opportunity-engine-report.json
          if-no-files-found: error
