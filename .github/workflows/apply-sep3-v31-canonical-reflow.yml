name: Apply Sep 3 V3.1 Canonical Reflow
on:
  push:
    branches:
      - apply/sep3-v31-canonical-reflow
    paths:
      - 'analysis/sep3-v31-canonical-apply-input.json'
      - 'scripts/apply-sep3-v31-canonical-reflow.mjs'
      - '.github/workflows/apply-sep3-v31-canonical-reflow.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply approved 35-player V3.1 reconciliation
        run: node scripts/apply-sep3-v31-canonical-reflow.mjs
      - name: Verify canonical synchronization
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('analysis/sep3-v31-canonical-apply-qa.json','utf8'));
          if(q.errors.length||!q.overall_unique||!q.true_value_unique||!q.projections_unchanged||q.changed!==35)throw new Error('canonical QA failed');
          const s=JSON.parse(fs.readFileSync('MODEL_SOURCE_OF_TRUTH.json','utf8'));
          const c=JSON.parse(fs.readFileSync('canonicalBoards2026.json','utf8'));
          if(s.active_player_model!==166||c.active_players!==166||c.overall.length!==166||c.trueValue.length!==166)throw new Error('166 sync failed');
          console.log('SEP3 V3.1 CANONICAL QA PASS');
          NODE
      - name: Commit synchronized canonical model
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MODEL_SOURCE_OF_TRUTH.json current162patch-2026-08-24.json players*.json canonicalBoards2026.json analysis/sep3-v31-canonical-apply-qa.json
          git diff --cached --quiet || git commit -m 'Apply Sep 3 V3.1 35-player canonical reconciliation [skip ci]'
          git push
