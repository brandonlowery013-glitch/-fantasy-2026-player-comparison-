name: UI Player Board Profile Step 4

on:
  pull_request:
    paths:
      - 'index.html'
      - 'runtime-player-board-profile-step4.js'
      - 'scripts/validate-ui-player-board-profile-step4.mjs'
      - '.github/workflows/ui-player-board-profile-step4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-player-board-profile-step4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Step 4 player board and profile UI
        run: node scripts/validate-ui-player-board-profile-step4.mjs
